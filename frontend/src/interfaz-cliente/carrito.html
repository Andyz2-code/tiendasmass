<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiendas Mass - Carrito de Compras</title>
  <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/accessibility.css">
  <script src="../../js/accessibility.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { mass: { yellow: '#FDCB02', red: '#E30613' } }
        }
      }
    };
  </script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans min-h-screen flex flex-col">
  <header class="bg-mass-yellow p-4 shadow-md border-b-2 border-amber-400">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center">
        <a href="index.html" class="flex items-center hover:opacity-95 transition">
          <img src="/tiendasmass/frontend/assets/logo-mass-oficial.png" alt="Tiendas Mass - Precios bajos, ¡cerca de ti!" class="h-10 sm:h-11 w-auto object-contain" onerror="this.src='../../assets/logo-mass-oficial.png'">
        </a>
      </div>
      <a href="index.html" class="text-xs font-bold bg-stone-900 text-white px-3 py-1.5 rounded-xl hover:bg-black">← Seguir Comprando</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    <h1 class="text-2xl font-black text-stone-900 mb-6 flex items-center gap-2">
      <span>🛒 Carrito de Compras</span>
    </h1>

    <div id="cart-content" class="bg-white rounded-3xl border border-stone-200 p-6 shadow-sm">
      <div id="cart-items" class="divide-y divide-stone-100"></div>
      <div id="cart-summary" class="mt-6 pt-6 border-t border-stone-200 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div>
          <p class="text-xs text-stone-500">Total a Pagar (Incluye IGV)</p>
          <p id="cart-total" class="text-2xl font-black text-mass-red">S/ 0.00</p>
        </div>
        <a href="index.html" class="px-6 py-3 bg-mass-yellow hover:bg-amber-400 text-stone-950 font-black rounded-2xl text-sm shadow-md transition">
          Finalizar Compra en Tienda Virtual
        </a>
      </div>
    </div>
  </main>

  <footer class="bg-stone-900 text-stone-400 text-xs py-6 text-center">
    <p>Tiendas Mass © 2026 – Módulo Carrito de Compras</p>
  </footer>

  <script>
    const items = JSON.parse(localStorage.getItem('mass_cart_items') || '[]');
    const itemsContainer = document.getElementById('cart-items');
    const totalEl = document.getElementById('cart-total');

    if (items.length === 0) {
      itemsContainer.innerHTML = '<div class="py-12 text-center text-stone-400 font-bold">Tu carrito está vacío. ¡Agrega productos desde la tienda!</div>';
      totalEl.textContent = 'S/ 0.00';
    } else {
      let total = 0;
      itemsContainer.innerHTML = items.map(item => {
        const sub = (Number(item.precio_venta || item.precio || 0)) * (item.quantity || 1);
        total += sub;
        return `
          <div class="py-4 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <img src="${item.imagen_url || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=100'}" class="w-12 h-12 object-contain rounded-lg bg-stone-50 border p-1">
              <div>
                <h4 class="font-bold text-xs sm:text-sm text-stone-900">${item.nombre}</h4>
                <p class="text-xs text-stone-500">${item.quantity || 1} x S/ ${Number(item.precio_venta || item.precio || 0).toFixed(2)}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="font-black text-sm text-stone-900">S/ ${sub.toFixed(2)}</span>
            </div>
          </div>
        `;
      }).join('');
      totalEl.textContent = `S/ ${total.toFixed(2)}`;
    }
  </script>
</body>
</html>
