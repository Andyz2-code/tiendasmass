<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkenya - Catálogo de Ahorro</title>
  <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/accessibility.css">
  <script src="../../js/accessibility.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mass: { yellow: '#FDCB02', red: '#E30613' }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans min-h-screen flex flex-col">
  <header class="bg-mass-yellow p-4 shadow-md border-b-2 border-amber-400">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center">
        <a href="index.html" class="flex items-center hover:opacity-95 transition">
          <img src="/tiendasmass/frontend/assets/logo-mass-oficial.png" alt="Arkenya - Precios bajos, ¡cerca de ti!" class="h-10 sm:h-11 w-auto object-contain" onerror="this.src='../../assets/logo-mass-oficial.png'">
        </a>
      </div>
      <a href="index.html" class="text-xs font-bold bg-stone-900 text-white px-3 py-1.5 rounded-xl hover:bg-black">← Volver a la Tienda</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    <h1 class="text-2xl font-black text-stone-900 mb-2">Catálogo de Productos</h1>
    <p class="text-stone-500 text-sm mb-6">Explora todos los productos de primera necesidad al precio más bajo.</p>
    <div id="catalogo-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
      <!-- Carga dinámica conectada al backend PHP -->
      <div class="p-8 text-center col-span-full text-stone-400">Cargando catálogo en tiempo real...</div>
    </div>
  </main>

  <footer class="bg-stone-900 text-stone-400 text-xs py-6 text-center">
    <p>Arkenya © 2026 – Módulo Catálogo de Productos</p>
  </footer>

  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    axios.get('http://localhost/tiendasmass/backend/public/api/productos?disponibles=1')
      .then(res => {
        const prods = res.data.data || [];
        const container = document.getElementById('catalogo-container');
        if (prods.length === 0) {
          container.innerHTML = '<div class="col-span-full text-center py-8">No hay productos disponibles actualmente.</div>';
          return;
        }
        container.innerHTML = prods.map(p => `
          <div class="bg-white rounded-2xl border border-stone-200 p-3 shadow-xs hover:shadow-md transition flex flex-col justify-between">
            <div class="h-28 bg-stone-50 rounded-xl mb-2 flex items-center justify-center overflow-hidden">
              <img src="${p.imagen_url || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=200'}" alt="${p.nombre}" class="max-h-full max-w-full object-contain">
            </div>
            <div>
              <p class="text-[10px] text-stone-400 uppercase font-bold">${p.categoria || 'Abarrotes'}</p>
              <h3 class="font-extrabold text-stone-900 text-xs line-clamp-2">${p.nombre}</h3>
              <p class="font-black text-sm text-stone-900 mt-1">S/ ${Number(p.precio_venta || 0).toFixed(2)}</p>
            </div>
            <a href="index.html" class="mt-2 text-center py-1 bg-mass-yellow hover:bg-amber-400 text-stone-950 font-black rounded-lg text-xs block">Ver en Tienda</a>
          </div>
        `).join('');
      })
      .catch(err => {
        document.getElementById('catalogo-container').innerHTML = '<div class="col-span-full text-center text-red-500 py-8">Error al conectar con la API de productos.</div>';
      });
  </script>
</body>
</html>
