    // ==========================================
    // 2. CHECKOUT CLIENTE CON DIRECCIÓN AUTOCOMPLETADA
    // ==========================================
    function CheckoutCliente({ branch, cart, client, onClearCart, onBack, onOrderPlaced }) {
      const [tipoEntrega, setTipoEntrega] = useState('DELIVERY');
      const [metodoPago, setMetodoPago] = useState('YAPE');

      // Toma automáticamente la dirección que guardó el cliente al registrarse o en su perfil
      const [direccion, setDireccion] = useState(() => client?.direccion_completa || 'Jr. Puno 345, Huancayo');
      const [referencia, setReferencia] = useState(() => client?.referencia || 'Frente a la Plaza Huamanmarca');
      const [lat, setLat] = useState(() => parseFloat(client?.latitud || -12.0691));
      const [lng, setLng] = useState(() => parseFloat(client?.longitud || -75.2092));
      const [distanceKm, setDistanceKm] = useState(0.8);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [error, setError] = useState('');

      const presets = [
        { name: 'Mi Domicilio Registrado', dist: 0.8, dir: client?.direccion_completa || 'Jr. Puno 345, Huancayo', lat: -12.0691, lng: -75.2092 },
        { name: 'Huancayo Centro (0.8 km)', dist: 0.8, dir: 'Jr. Puno 345, Huancayo', lat: -12.0691, lng: -75.2092 },
        { name: 'San Carlos (1.8 km)', dist: 1.8, dir: 'Av. San Carlos 1120', lat: -12.0621, lng: -75.1985 },
        { name: 'El Tambo (3.5 km)', dist: 3.5, dir: 'Av. Huancavelica 1450, El Tambo', lat: -12.0530, lng: -75.2180 },
        { name: 'Jauja (42 km - Fuera Cobertura)', dist: 42.0, dir: 'Carretera Central, Jauja', lat: -11.7750, lng: -75.4960 }
      ];

      const inCoverage = distanceKm <= (branch?.radio_cobertura_km || 5.0);
      const costoEnvio = (tipoEntrega === 'DELIVERY' && inCoverage) ? parseFloat((4.00 + Math.max(0, distanceKm - 1) * 1.50).toFixed(2)) : 0.00;
      const totalMercaderia = cart.reduce((acc, i) => acc + (parseFloat(i.producto.precio_venta) * i.cantidad), 0);
      const totalFinal = totalMercaderia + costoEnvio;

      const handleConfirm = async () => {
        if (cart.length === 0) return setError('La canasta está vacía');
        if (tipoEntrega === 'DELIVERY' && !inCoverage) {
          return setError(`Ubicación fuera del radio de entrega (${distanceKm} km > ${branch?.radio_cobertura_km} km)`);
        }

        setIsSubmitting(true);
        setError('');
        try {
          const payload = {
            sucursal_id: branch.id,
            cliente_id: client?.id || 1,
            tipo_entrega: tipoEntrega,
            metodo_pago: metodoPago,
            items: cart.map(i => ({ producto_id: i.producto.id, cantidad: i.cantidad })),
            delivery_info: tipoEntrega === 'DELIVERY' ? {
              direccion_completa: direccion,
              referencia: referencia,
              latitud: lat,
              longitud: lng
            } : null
          };
          const res = await api.post('/pedidos', payload);
          onClearCart();
          onOrderPlaced(res.data);
        } catch (err) {
          setError(err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="space-y-6">
          <button onClick={onBack} className="text-xs font-bold text-stone-600 hover:text-stone-900">← Volver al catálogo</button>

          {error && <div className="p-4 bg-red-50 text-red-700 text-xs rounded-2xl border font-bold">{error}</div>}

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-7 space-y-5">
              <div className="bg-white p-5 rounded-2xl border space-y-3 shadow-sm">
                <h3 className="text-xs font-extrabold text-stone-900 uppercase">1. Modalidad de Entrega</h3>
                <div className="grid grid-cols-2 gap-3 text-xs">
                  <button onClick={() => setTipoEntrega('DELIVERY')} className={`p-3 rounded-xl border font-bold ${tipoEntrega === 'DELIVERY' ? 'border-amber-400 bg-amber-50' : ''}`}>🛵 Delivery Express a Domicilio</button>
                  <button onClick={() => setTipoEntrega('RETIRO_TIENDA')} className={`p-3 rounded-xl border font-bold ${tipoEntrega === 'RETIRO_TIENDA' ? 'border-amber-400 bg-amber-50' : ''}`}>🏬 Retiro en Tienda Mass</button>
                </div>
              </div>

              {tipoEntrega === 'DELIVERY' && (
                <div className="bg-white p-5 rounded-2xl border space-y-3 shadow-sm">
                  <div className="flex justify-between items-center">
                    <h3 className="text-xs font-extrabold text-stone-900 uppercase">2. Dirección de Entrega en Huancayo</h3>
                    {client?.direccion_completa && (
                      <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">
                        ✓ Autocompletada de tu Perfil
                      </span>
                    )}
                  </div>

                  {/* Selector rápido */}
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                    {presets.map((p, idx) => (
                      <button
                        key={idx}
                        onClick={() => { setDistanceKm(p.dist); setDireccion(p.dir); setLat(p.lat); setLng(p.lng); }}
                        className={`p-2 rounded-lg border text-left transition ${direccion === p.dir ? 'border-amber-400 bg-amber-50 font-bold text-amber-950' : 'bg-white'}`}
                      >
                        <div className="truncate font-semibold">{p.name}</div>
                      </button>
                    ))}
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-stone-600 mb-1">Dirección Exacta:</label>
                    <input
                      type="text"
                      value={direccion}
                      onChange={e => setDireccion(e.target.value)}
                      className="w-full p-2.5 border rounded-xl text-xs font-semibold"
                      placeholder="Ej: Jr. Puno 345, Huancayo"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-stone-600 mb-1">Referencia:</label>
                    <input
                      type="text"
                      value={referencia}
                      onChange={e => setReferencia(e.target.value)}
                      className="w-full p-2.5 border rounded-xl text-xs font-medium"
                      placeholder="Ej: Frente al parque Huamanmarca"
                    />
                  </div>

                  <div className="flex justify-between text-xs p-3 bg-stone-50 rounded-xl border">
                    <span>Distancia calculada: <strong>{distanceKm} km</strong></span>
                    <span className={inCoverage ? 'text-emerald-600 font-bold' : 'text-red-600 font-bold'}>
                      {inCoverage ? '✓ Dentro del Radio de Entrega' : '✕ Fuera de Cobertura'}
                    </span>
                  </div>
                </div>
              )}

              <div className="bg-white p-5 rounded-2xl border space-y-3 shadow-sm">
                <h3 className="text-xs font-extrabold text-stone-900 uppercase">3. Método de Pago</h3>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs font-bold text-center">
                  {['YAPE', 'PLIN', 'TARJETA', 'EFECTIVO_CONTRA_ENTREGA'].map(m => (
                    <button key={m} onClick={() => setMetodoPago(m)} className={`p-3 rounded-xl border ${metodoPago === m ? 'border-mass-red bg-red-50 text-mass-red' : ''}`}>
                      {m === 'EFECTIVO_CONTRA_ENTREGA' ? 'Contra Entrega' : m}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="lg:col-span-5">
              <div className="bg-white p-6 rounded-3xl border shadow-sm sticky top-24 space-y-4">
                <h3 className="text-sm font-extrabold text-stone-900 pb-2 border-b">Resumen de Compra</h3>
                <div className="space-y-2 text-xs max-h-48 overflow-y-auto custom-scroll">
                  {cart.map(i => (
                    <div key={i.producto.id} className="flex justify-between">
                      <span>{i.cantidad}x {i.producto.nombre}</span>
                      <strong>S/. {(parseFloat(i.producto.precio_venta) * i.cantidad).toFixed(2)}</strong>
                    </div>
                  ))}
                </div>
                <div className="pt-3 border-t space-y-1.5 text-xs">
                  <div className="flex justify-between text-stone-500"><span>Subtotal (sin IGV):</span><span>S/. {(totalMercaderia / 1.18).toFixed(2)}</span></div>
                  <div className="flex justify-between text-stone-500"><span>IGV (18% Perú):</span><span>S/. {(totalMercaderia - (totalMercaderia / 1.18)).toFixed(2)}</span></div>
                  <div className="flex justify-between text-stone-500"><span>Costo Envío:</span><span>S/. {costoEnvio.toFixed(2)}</span></div>
                  <div className="flex justify-between text-base font-extrabold pt-2 border-t text-mass-red">
                    <span>Total a Pagar:</span><span>S/. {totalFinal.toFixed(2)}</span>
                  </div>
                </div>
                <button
                  onClick={handleConfirm}
                  disabled={isSubmitting || (tipoEntrega === 'DELIVERY' && !inCoverage)}
                  className="w-full py-3.5 bg-mass-yellow hover:bg-amber-400 text-stone-950 font-extrabold rounded-2xl text-xs uppercase shadow transition disabled:opacity-40"
                >
                  {isSubmitting ? 'Procesando Venta PEPS...' : 'Confirmar Pedido y Pagar'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. REPORTE / HISTORIAL DE COMPRAS REALIZADAS
    // ==========================================
    function MisComprasCliente({ client, onTrackDelivery, onConfirmPickup, onBackToStore }) {
      const [pedidos, setPedidos] = useState([]);
      const [loading, setLoading] = useState(true);

      const loadOrders = () => {
        if (!client?.id) return;
        setLoading(true);
        api.get(`/pedidos?cliente_id=${client.id}`)
          .then(res => setPedidos(res.data || []))
          .finally(() => setLoading(false));
      };

      useEffect(() => { loadOrders(); }, [client]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-xl font-extrabold text-stone-900 tracking-tight">Reporte de Mis Compras Realizadas</h1>
              <p className="text-xs text-stone-500">
                Historial de pedidos de <strong className="text-stone-900">{client?.nombres} {client?.apellidos}</strong> con estado y seguimiento en vivo.
              </p>
            </div>
            <button onClick={onBackToStore} className="px-4 py-2 bg-stone-950 text-white rounded-xl text-xs font-bold shadow">
              🛒 Ir a la Tienda
            </button>
          </div>

          {loading ? (
            <div className="p-8 text-center text-xs font-bold text-stone-500 animate-pulse">Cargando tus compras...</div>
          ) : pedidos.length > 0 ? (
            <div className="space-y-4">
              {pedidos.map(p => {
                const isPending = p.estado_pedido === 'PENDIENTE';
                const isPrep = p.estado_pedido === 'EN_PREPARACION';
                const isEnRuta = p.estado_pedido === 'DESPACHADO' || p.estado_delivery === 'EN_RUTA';
                const isEntregado = p.estado_pedido === 'ENTREGADO';

                return (
                  <div key={p.id} className="bg-white p-5 rounded-3xl border border-stone-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4 hover:shadow-md transition">
                    <div className="space-y-1.5 flex-1">
                      <div className="flex items-center gap-2">
                        <span className="font-mono font-extrabold text-sm text-stone-950">{p.codigo_pedido}</span>
                        <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-black ${
                          isEntregado ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' :
                          isEnRuta ? 'bg-blue-100 text-blue-800 animate-pulse' :
                          isPrep ? 'bg-purple-100 text-purple-800' : 'bg-amber-100 text-amber-800'
                        }`}>
                          {isEntregado ? '✓ ENTREGADO / FINALIZADO' : isEnRuta ? '🛵 EN RUTA (EN CAMINO)' : isPrep ? '📦 EN PREPARACIÓN' : '⏳ PENDIENTE'}
                        </span>
                      </div>

                      <div className="text-xs text-stone-600 flex flex-wrap items-center gap-3">
                        <span>📅 Fecha: <strong>{p.fecha_pedido}</strong></span>
                        <span>🏬 Tienda: <strong>{p.sucursal_nombre}</strong></span>
                        <span>💳 Pago: <strong>{p.metodo_pago}</strong></span>
                        <span>Modalidad: <strong className="text-stone-900">{p.tipo_entrega}</strong></span>
                      </div>

                      {p.tipo_entrega === 'DELIVERY' && p.direccion_destino && (
                        <div className="text-[11px] text-stone-500 flex items-center gap-1 pt-1">
                          <span>📍 Destino:</span>
                          <span className="font-medium text-stone-800">{p.direccion_destino}</span>
                        </div>
                      )}
                    </div>

                    <div className="flex flex-col sm:flex-row md:flex-col items-end gap-2 w-full md:w-auto pt-3 md:pt-0 border-t md:border-t-0 border-stone-200">
                      <div className="text-right">
                        <div className="text-xs text-stone-400 font-semibold">Total Pagado:</div>
                        <div className="text-lg font-extrabold text-mass-red">S/. {parseFloat(p.total).toFixed(2)}</div>
                      </div>

                      {isEntregado ? (
                        <div className="flex flex-col sm:flex-row items-center gap-2">
                          <div className="flex items-center gap-1 text-emerald-800 bg-emerald-50 border border-emerald-300 px-3 py-1.5 rounded-xl text-xs font-black">
                            <span>✓ Compra Finalizada</span>
                          </div>
                          {p.tipo_entrega === 'DELIVERY' && (
                            <button
                              onClick={() => onTrackDelivery(p)}
                              className="text-stone-500 hover:text-stone-800 text-[11px] font-bold underline"
                            >
                              Ver Ruta GPS
                            </button>
                          )}
                        </div>
                      ) : p.tipo_entrega === 'DELIVERY' ? (
                        <button
                          onClick={() => onTrackDelivery(p)}

    // ==========================================
    // 4. SIMULACIÓN DE DELIVERY EN LA INTERFAZ DEL CLIENTE
    // ==========================================
    function RastreoDeliveryCliente({ order, branch, onDeliveryCompleted, onBackToOrders, onBackToStore }) {
      const isAlreadyDelivered = order?.estado_pedido === 'ENTREGADO';
      const [driverLat, setDriverLat] = useState(-12.0684);
      const [driverLng, setDriverLng] = useState(-75.2100);
      const [simulating, setSimulating] = useState(false);
      const [progressPercent, setProgressPercent] = useState(() => isAlreadyDelivered ? 100 : 30);
      const [orderStatus, setOrderStatus] = useState(() => order?.estado_pedido || 'DESPACHADO');

      const destAddress = order?.direccion_destino || order?.delivery?.direccion_destino || 'Jr. Puno 345, Huancayo';
      const storeName = order?.sucursal_nombre || branch?.nombre || 'Tienda Mass - Huancayo Centro';
      const orderCode = order?.codigo_pedido || 'PED-MASS-001';

      // Simulador de avance de la moto hacia el domicilio del cliente
      useEffect(() => {
        let timer = null;
        if (simulating) {
          let step = 0;
          timer = setInterval(() => {
            step++;
            const pct = Math.min(100, 30 + (step * 10));
            setProgressPercent(pct);

            // Interpolación de coordenadas simulada en Huancayo
            setDriverLat(-12.0684 + ((-12.0691 - -12.0684) * (step / 7)));
            setDriverLng(-75.2100 + ((-75.2092 - -75.2100) * (step / 7)));

            if (step >= 7) {
              setSimulating(false);
              clearInterval(timer);
              setOrderStatus('ENTREGADO');

              // Actualiza estado en MariaDB para que el reporte de compras lo muestre como FINALIZADO
              if (order?.id) {
                api.put(`/pedidos/${order.id}/estado`, { estado_pedido: 'ENTREGADO' })
                  .then(() => {
                    if (order) order.estado_pedido = 'ENTREGADO';
                  })
                  .catch(console.error);
              }

              // Muestra el mensaje de agradecimiento
              if (onDeliveryCompleted) {
                onDeliveryCompleted({ ...order, estado_pedido: 'ENTREGADO' });
              }
            }
          }, 1200);
        }
        return () => { if (timer) clearInterval(timer); };
      }, [simulating]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="font-mono text-xs bg-amber-100 text-amber-900 px-2 py-0.5 rounded font-extrabold">{orderCode}</span>
                <span className="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-extrabold">{orderStatus}</span>
              </div>
              <h1 className="text-xl font-extrabold text-stone-900 tracking-tight mt-1">
                Seguimiento Satelital de tu Pedido en Tiempo Real
              </h1>
              <p className="text-xs text-stone-500">
                Observa por dónde viene tu repartidor motorizado desde el almacén hasta tu domicilio.
              </p>
            </div>

            <div className="flex gap-2">
              <button
                onClick={() => setSimulating(!simulating)}
                className={`px-4 py-2 font-extrabold text-xs rounded-xl shadow transition flex items-center gap-2 ${
                  simulating ? 'bg-red-600 text-white animate-pulse' : 'bg-mass-yellow hover:bg-amber-400 text-stone-950'
                }`}
              >
                <span>{simulating ? '⏹ Detener Simulación' : '▶ Simular Avance del Repartidor (GPS)'}</span>
              </button>
              <button onClick={onBackToOrders} className="px-3 py-2 bg-stone-200 hover:bg-stone-300 text-stone-800 text-xs font-bold rounded-xl">
                Mis Compras
              </button>
            </div>
          </div>

          {/* Mapa Visual del Delivery */}
          <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm space-y-4">
            <div className="relative w-full h-80 bg-stone-900 rounded-2xl overflow-hidden p-5 text-white flex flex-col justify-between border border-stone-700 shadow-inner">
              <div className="absolute inset-0 opacity-20 bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:20px_20px]"></div>

              {/* Pin Origen: Tienda Mass */}
              <div className="relative z-10 flex items-center gap-2 bg-stone-800/90 backdrop-blur px-3 py-1.5 rounded-lg border border-stone-700 w-fit text-xs">
                <span className="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                <span>Tienda Despachadora: <strong className="text-amber-400">{storeName}</strong></span>
              </div>

              {/* Motorizado en Camino */}
              <div
                className="relative z-10 self-center flex flex-col items-center transition-all duration-1000"
                style={{ transform: `translateX(${(progressPercent - 50) * 4}px)` }}
              >
                <div className="p-3 bg-mass-yellow text-stone-950 rounded-full text-2xl shadow-2xl border-2 border-white animate-bounce">
                  🛵
                </div>
                <span className="text-[10px] bg-stone-950 text-amber-300 px-2 py-0.5 rounded font-extrabold mt-1 border border-stone-700">
                  {simulating ? 'Motorizado en ruta (24 km/h)' : 'Motorizado Mass Express'}
                </span>
              </div>

              {/* Pin Destino: Casa del Cliente */}
              <div className="relative z-10 flex items-center justify-between bg-stone-800/90 backdrop-blur p-3 rounded-xl border border-stone-700 text-xs">
                <div className="flex items-center gap-2">
                  <span className="text-mass-red text-base">📍</span>
                  <div>
                    <div className="font-bold text-white">Tu Domicilio de Entrega:</div>
                    <div className="text-[11px] text-stone-300">{destAddress}</div>
                  </div>
                </div>
                <div className="text-right">
                  <div className="text-amber-400 font-extrabold text-sm">{simulating ? `${Math.max(2, Math.round(15 * (1 - progressPercent/100)))} min` : '~15 min'}</div>
                  <div className="text-[10px] text-stone-400 font-medium">Tiempo estimado</div>
                </div>
              </div>
            </div>

            {/* Timeline de Hitos del Pedido */}
            <div className="grid grid-cols-4 gap-2 pt-2 text-center text-xs">
              <div className="p-3 rounded-2xl border border-emerald-300 bg-emerald-50 text-emerald-800 font-bold">
                <div className="text-base mb-1">✓</div>
                <div>1. Pedido Recibido</div>
              </div>
              <div className="p-3 rounded-2xl border border-emerald-300 bg-emerald-50 text-emerald-800 font-bold">
                <div className="text-base mb-1">📦</div>
                <div>2. Picking PEPS</div>
              </div>
              <div className={`p-3 rounded-2xl border font-bold ${
                orderStatus === 'ENTREGADO' || progressPercent > 40 ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : 'border-amber-300 bg-amber-50 text-amber-900 animate-pulse'
              }`}>
                <div className="text-base mb-1">🛵</div>
                <div>3. En Camino (Moto)</div>
              </div>
              <div className={`p-3 rounded-2xl border font-bold ${
                orderStatus === 'ENTREGADO' ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : 'border-stone-200 text-stone-400'
              }`}>
                <div className="text-base mb-1">🏠</div>
                <div>4. Entregado</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function LoginClienteModal({ isOpen, onClose, onLoginSuccess }) {
      const [tab, setTab] = useState('login'); // 'login' | 'register'
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('123456');
      const [tipoDoc, setTipoDoc] = useState('DNI');
      const [numDoc, setNumDoc] = useState('');
      const [nombres, setNombres] = useState('');
      const [apellidos, setApellidos] = useState('');
      const [telefono, setTelefono] = useState('');

      const [referencia, setReferencia] = useState('Frente a la Plaza Huamanmarca');
      const [error, setError] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        setError('');
        try {
          const res = await api.post('/auth/login-client', { email, password });
          onLoginSuccess(res.data.client || res.data.user, res.data.token);
        } catch (err) {
          setError(err.message);
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setError('');
        if (tipoDoc === 'DNI' && !/^\d{8}$/.test(numDoc)) return setError('DNI debe tener exactamente 8 dígitos');
        if (tipoDoc === 'PASAPORTE' && !/^[A-Za-z0-9]{6,12}$/.test(numDoc)) return setError('Pasaporte debe tener entre 6 y 12 caracteres');

        try {
          const res = await api.post('/auth/register-client', {
            tipo_documento: tipoDoc,
            numero_documento: numDoc,
            nombres,
            apellidos,
            email,
            password,
            telefono,
            direccion_completa: direccion,
            referencia
          });
          onLoginSuccess(res.data.client, res.data.token);
        } catch (err) {
          setError(err.message);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">

                <div className="pt-2 text-[10px] text-stone-500 space-y-1">

                </div>
              )}

              <div className="flex justify-between items-center pt-2 border-t border-stone-200">
                <span className="text-stone-500 font-bold">Estado en Reporte:</span>
                <span className="font-black text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded text-[10px]">
                  ✓ FINALIZADO / ENTREGADO
                </span>
              </div>
            </div>

            <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 text-[11px] text-amber-950 font-medium">
              💡 <strong>Ahorro Mass Garantizado:</strong> Sus productos fueron empacados cumpliendo la estricta rotación de lotes PEPS. ¡Esperamos que los disfrute!
            </div>

            <div className="flex flex-col sm:flex-row gap-2 pt-2">
              <button
                onClick={onViewOrders}
                className="flex-1 py-3 bg-stone-950 hover:bg-stone-800 text-amber-300 font-extrabold rounded-xl text-xs shadow transition flex items-center justify-center gap-1.5"
              >
                <span>📋 Ver en Mis Compras</span>
              </button>
              <button
                onClick={onClose}
                className="flex-1 py-3 bg-mass-yellow hover:bg-amber-400 text-stone-950 font-extrabold rounded-xl text-xs shadow transition"
              >
                🛒 Seguir Comprando
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PortalCliente />);
  </script>
</body>
</html>
