<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiendas Mass - Tienda Virtual | Canasta Básica de Ahorro</title>
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/4/4b/Mass_logo.svg">
  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Módulos de Accesibilidad y Estilos -->
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/logo.css">
  <script src="js/accessibility.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mass: {
              yellow: '#FDCB02',
              red: '#E30613',
              dark: '#1C1917',
              gray: '#F5F5F4'
            }
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-stone-100 text-stone-900 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const API_BASE = 'http://localhost/tiendasmass/backend/public/api';

    const api = axios.create({
      baseURL: API_BASE,
      headers: { 'Content-Type': 'application/json' }
    });

    api.interceptors.request.use((config) => {
      const token = localStorage.getItem('mass_client_token');
      if (token) config.headers.Authorization = `Bearer ${token}`;
      return config;
    });

    api.interceptors.response.use(
      (res) => res.data,
      (err) => Promise.reject(new Error(err.response?.data?.message || err.message || 'Error en el servidor'))
    );

    function PortalCliente() {
      // Vistas disponibles: 'catalogo' | 'checkout' | 'mis_compras' | 'rastreo_delivery'
      const [view, setView] = useState('catalogo');
      const [sucursales, setSucursales] = useState([]);
      const [selectedBranch, setSelectedBranch] = useState(null);
      const [cart, setCart] = useState(() => {
        const saved = JSON.parse(localStorage.getItem('mass_client_cart') || '[]');
        if (saved && saved.length > 0) return saved;
        return [{
          producto: {
            id: 2,
            nombre: "Aceite Vegetal Primor Clásico 900 ml",
            codigo_sku: "SKU-ACE-002",
            precio_venta: "8.50",
            imagen_url: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=300"
          },
          cantidad: 1
        }];
      });
      const [client, setClient] = useState(() => JSON.parse(localStorage.getItem('mass_client_user') || 'null'));
      const [trackingOrder, setTrackingOrder] = useState(null); // Pedido activo para rastrear
      const [isCartOpen, setIsCartOpen] = useState(() => new URLSearchParams(window.location.search).get('cart') === 'open');
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [isProfileOpen, setIsProfileOpen] = useState(false);
      const [isProfileMenuOpen, setIsProfileMenuOpen] = useState(false);
      const [isThankYouOpen, setIsThankYouOpen] = useState(false);
      const [thankYouInfo, setThankYouInfo] = useState(null);
      const [clientOrdersCount, setClientOrdersCount] = useState(0);

      // Estados de Búsqueda con Debounce de 500ms
      const [categorias, setCategorias] = useState([]);
      const [searchTerm, setSearchTerm] = useState(() => new URLSearchParams(window.location.search).get('search') || new URLSearchParams(window.location.search).get('q') || '');
      const [debouncedSearch, setDebouncedSearch] = useState('');
      const [isSearching, setIsSearching] = useState(false);
      const [a11ySearchStatus, setA11ySearchStatus] = useState('');
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [isOffersOnly, setIsOffersOnly] = useState(false);
      const [isFavoritesOnly, setIsFavoritesOnly] = useState(false);
      const [favorites, setFavorites] = useState(() => JSON.parse(localStorage.getItem('mass_client_favorites') || '[]'));
      const [isCategoriesOpen, setIsCategoriesOpen] = useState(false);

      // Efecto Debounce de 500ms obligatorio para evitar múltiples llamadas al escribir
      useEffect(() => {
        const trimmed = searchTerm.trim();
        if (trimmed === '') {
          setDebouncedSearch('');
          setIsSearching(false);
          setA11ySearchStatus('Búsqueda restablecida. Mostrando catálogo completo.');
          return;
        }

        setIsSearching(true);
        setA11ySearchStatus(`Escribiendo "${trimmed}"...`);

        const timer = setTimeout(() => {
          setDebouncedSearch(trimmed);
          setIsSearching(false);
          setA11ySearchStatus(`Búsqueda lista para "${trimmed}".`);
        }, 500);

        return () => clearTimeout(timer);
      }, [searchTerm]);

      useEffect(() => {
        api.get('/sucursales').then((res) => {
          const list = res.data || [];
          setSucursales(list);
          if (list.length > 0) {
            const saved = JSON.parse(localStorage.getItem('mass_selected_branch') || 'null');
            const initial = list.find(s => s.id === saved?.id) || list[0];
            setSelectedBranch(initial);
          }
        }).catch(console.error);

        api.get('/categorias').then((res) => {
          setCategorias(res.data || []);
        }).catch(console.error);
      }, []);

      const toggleFavorite = (productId) => {
        setFavorites(prev => {
          const next = prev.includes(productId) ? prev.filter(id => id !== productId) : [...prev, productId];
          localStorage.setItem('mass_client_favorites', JSON.stringify(next));
          return next;
        });
      };

      useEffect(() => {
        localStorage.setItem('mass_client_cart', JSON.stringify(cart));
      }, [cart]);

      // Consultar cantidad de compras del cliente
      useEffect(() => {
        if (client?.id) {
          api.get(`/pedidos?cliente_id=${client.id}`).then((res) => {
            setClientOrdersCount((res.data || []).length);
          }).catch(() => {});
        }
      }, [client, view]);

      const handleSelectBranch = (bId) => {
        const b = sucursales.find(s => s.id === parseInt(bId));
        if (b) {
          setSelectedBranch(b);
          localStorage.setItem('mass_selected_branch', JSON.stringify(b));
        }
      };

      const handleLogout = () => {
        setClient(null);
        localStorage.removeItem('mass_client_user');
        localStorage.removeItem('mass_client_token');
        setView('catalogo');
      };

      const addToCart = (producto, cant = 1) => {
        setCart(prev => {
          const exists = prev.find(i => i.producto.id === producto.id);
          if (exists) {
            return prev.map(i => i.producto.id === producto.id ? { ...i, cantidad: i.cantidad + cant } : i);
          }
          return [...prev, { producto, cantidad: cant }];
        });
      };

      const updateCartQty = (id, cant) => {
        if (cant <= 0) {
          setCart(prev => prev.filter(i => i.producto.id !== id));
        } else {
          setCart(prev => prev.map(i => i.producto.id === id ? { ...i, cantidad: cant } : i));
        }
      };

      const totalMercaderia = cart.reduce((acc, i) => acc + (parseFloat(i.producto.precio_venta) * i.cantidad), 0);
      const totalItems = cart.reduce((acc, i) => acc + i.cantidad, 0);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Barra Superior con Anuncio Comercial */}
          <div className="bg-mass-red text-white text-[11px] font-bold py-1.5 px-4 text-center">
            <span>¡TIENDAS MASS HUANCAYO! Precios bajos todos los días y entregas express con control PEPS.</span>
          </div>

          {/* Header Principal Tiendas Mass (Color Amarillo y Logo Original) */}
          <header className="bg-mass-yellow shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between gap-4">
              
              {/* 1. Logo Original Mass (Caja Roja con letras Amarillas) */}
              <div
                onClick={() => {
                  setSearchTerm('');
                  setSelectedCategory(null);
                  setIsOffersOnly(false);
                  setIsFavoritesOnly(false);
                  setView('catalogo');
                }}
                className="flex items-center cursor-pointer shrink-0 group py-1"
                title="Ir al inicio de Tiendas Mass"
              >
                <img
                  src="assets/images/logo-mass-oficial.png"
                  alt="Tiendas Mass - Precios bajos, ¡cerca de ti!"
                  className="h-9 sm:h-11 md:h-12 w-auto max-w-[200px] sm:max-w-[270px] md:max-w-[320px] object-contain select-none group-hover:scale-102 transition-transform"
                  onError={(e) => { e.target.src = 'assets/logo-mass-oficial.png'; }}
                />
              </div>

              {/* 2. Barra de Búsqueda Amplia y Accesible con Debounce de 500ms */}
              <div className="flex-1 max-w-2xl mx-2 sm:mx-4" role="search" aria-label="Búsqueda de productos">
                <div className="flex items-center bg-white rounded-full border-2 border-stone-200 focus-within:border-mass-red overflow-hidden shadow-sm transition">
                  <span className="pl-4 pr-2 text-stone-400 text-sm flex items-center justify-center min-w-[2rem]">
                    {isSearching ? (
                      <span className="inline-block w-4 h-4 border-2 border-mass-red border-t-transparent rounded-full animate-spin" aria-hidden="true"></span>
                    ) : (
                      <span>🔍</span>
                    )}
                  </span>
                  <input
                    type="search"
                    value={searchTerm}
                    onChange={(e) => {
                      setSearchTerm(e.target.value);
                      if (view !== 'catalogo') setView('catalogo');
                    }}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        setDebouncedSearch(searchTerm.trim());
                        setView('catalogo');
                        const el = document.getElementById("catalogo-grid");
                        if (el) el.scrollIntoView({ behavior: "smooth" });
                      } else if (e.key === 'Escape') {
                        setSearchTerm('');
                        setDebouncedSearch('');
                      }
                    }}
                    placeholder="Busca productos, marca (ej. arroz, leche)..."
                    aria-label="Buscar productos por nombre, marca o categoría"
                    aria-busy={isSearching}
                    autoComplete="off"
                    className="w-full py-2.5 text-xs sm:text-sm text-stone-800 placeholder-stone-400 focus:outline-none bg-transparent font-medium"
                  />
                  {searchTerm && (
                    <button
                      type="button"
                      onClick={() => {
                        setSearchTerm('');
                        setDebouncedSearch('');
                      }}
                      className="px-2.5 py-1 text-stone-400 hover:text-stone-700 font-bold text-xs cursor-pointer"
                      title="Limpiar búsqueda"
                      aria-label="Limpiar búsqueda"
                    >
                      ✕
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => {
                      setDebouncedSearch(searchTerm.trim());
                      setView('catalogo');
                      const el = document.getElementById("catalogo-grid");
                      if (el) el.scrollIntoView({ behavior: "smooth" });
                    }}
                    className="bg-[#ff671f] hover:bg-[#ea580c] text-white font-black text-xs sm:text-sm px-6 py-2.5 transition shrink-0 uppercase tracking-wide cursor-pointer"
                  >
                    Buscar
                  </button>
                </div>
                {/* Región ARIA Live accesible para lectores de pantalla */}
                <div className="sr-only" role="status" aria-live="polite">
                  {a11ySearchStatus}
                </div>
              </div>

              {/* 3. Selector de Sucursal */}
              <div className="hidden lg:flex items-center gap-2 bg-white/95 px-3 py-1.5 rounded-xl border border-stone-200 text-xs shadow-sm shrink-0">
                <span className="text-mass-red font-bold">📍</span>
                <div className="flex flex-col">
                  <span className="text-[9px] uppercase font-bold text-stone-400 leading-tight">Comprando en:</span>
                  <select
                    value={selectedBranch?.id || ''}
                    onChange={(e) => handleSelectBranch(e.target.value)}
                    className="font-bold text-stone-900 bg-transparent focus:outline-none cursor-pointer text-xs"
                  >
                    {sucursales.map(s => (
                      <option key={s.id} value={s.id}>{s.nombre} (Radio {s.radio_cobertura_km} km)</option>
                    ))}
                  </select>
                </div>
              </div>

              {/* 4. Botones de Perfil (con Menú Desplegable de 3 Secciones) y Carrito */}
              <div className="flex items-center gap-2 sm:gap-3 shrink-0">
                {client ? (
                  <div className="relative">
                    {/* Botón Disparador del Perfil */}
                    <button
                      onClick={() => setIsProfileMenuOpen(!isProfileMenuOpen)}
                      className="flex items-center gap-2 bg-white hover:bg-stone-50 px-3 py-1.5 rounded-xl border border-stone-200 text-xs shadow-sm transition"
                    >
                      <div className="w-7 h-7 rounded-full bg-mass-yellow flex items-center justify-center font-black text-stone-950 border border-amber-300 text-xs">
                        {client.nombres ? client.nombres.charAt(0).toUpperCase() : '👤'}
                      </div>
                      <div className="text-left hidden sm:block">
                        <div className="font-extrabold text-stone-900 leading-tight flex items-center gap-1">
                          <span>{client.nombres}</span>
                          <span className="text-[10px] text-stone-400">▼</span>
                        </div>
                        <div className="text-[9px] text-stone-500 font-medium truncate max-w-[120px]">
                          {client.direccion_completa ? client.direccion_completa : 'Huancayo'}
                        </div>
                      </div>
                    </button>

                    {/* Menú Desplegable con las 3 Secciones: Editar Perfil, Mis Compras y Cerrar Sesión */}
                    {isProfileMenuOpen && (
                      <>
                        <div
                          className="fixed inset-0 z-40"
                          onClick={() => setIsProfileMenuOpen(false)}
                        ></div>
                        <div className="absolute right-0 mt-2 w-72 bg-white rounded-2xl shadow-2xl border border-stone-200 z-50 overflow-hidden py-1">
                          {/* Resumen del Perfil */}
                          <div className="p-3 bg-stone-50 border-b border-stone-100">
                            <div className="flex items-center gap-2.5">
                              <div className="w-10 h-10 rounded-full bg-mass-yellow text-stone-950 font-black flex items-center justify-center text-sm shadow-sm border border-amber-300">
                                {client.nombres ? client.nombres.charAt(0).toUpperCase() : 'C'}
                              </div>
                              <div className="overflow-hidden">
                                <div className="font-extrabold text-xs text-stone-900 truncate">
                                  {client.nombres} {client.apellidos}
                                </div>
                                <div className="text-[10px] text-stone-500 font-medium truncate">
                                  {client.email}
                                </div>
                                <div className="text-[9px] font-bold text-amber-800 bg-amber-100 inline-block px-1.5 py-0.2 rounded mt-0.5">
                                  {client.tipo_documento}: {client.numero_documento}
                                </div>
                              </div>
                            </div>
                            {client.direccion_completa && (
                              <div className="mt-2 text-[10px] text-stone-600 bg-white p-1.5 rounded-lg border border-stone-200 flex items-start gap-1">
                                <span className="text-mass-red">📍</span>
                                <span className="truncate">{client.direccion_completa}</span>
                              </div>
                            )}
                          </div>

                          {/* Las 3 Secciones Requeridas */}
                          <div className="p-1.5 space-y-1 text-xs">
                            {/* SECCIÓN 1: EDITAR PERFIL */}
                            <button
                              onClick={() => {
                                setIsProfileMenuOpen(false);
                                setIsProfileOpen(true);
                              }}
                              className="w-full flex items-center gap-3 px-3 py-2.5 text-stone-800 hover:bg-amber-50 rounded-xl font-bold transition text-left group"
                            >
                              <span className="w-8 h-8 rounded-xl bg-amber-100 text-amber-900 flex items-center justify-center text-sm group-hover:scale-105 transition">
                                ✏️
                              </span>
                              <div className="flex-1">
                                <div className="font-bold text-stone-900 leading-tight">Editar Perfil</div>
                                <div className="text-[10px] text-stone-500 font-normal">
                                  Modificar dirección en Huancayo y datos
                                </div>
                              </div>
                            </button>

                            {/* SECCIÓN 2: MIS COMPRAS */}
                            <button
                              onClick={() => {
                                setIsProfileMenuOpen(false);
                                setView('mis_compras');
                              }}
                              className="w-full flex items-center gap-3 px-3 py-2.5 text-stone-800 hover:bg-amber-50 rounded-xl font-bold transition text-left group"
                            >
                              <span className="w-8 h-8 rounded-xl bg-red-100 text-mass-red flex items-center justify-center text-sm group-hover:scale-105 transition">
                                📋
                              </span>
                              <div className="flex-1">
                                <div className="font-bold text-stone-900 leading-tight flex items-center justify-between">
                                  <span>Mis Compras</span>
                                  {clientOrdersCount > 0 && (
                                    <span className="bg-mass-red text-white text-[10px] font-extrabold px-1.5 py-0.2 rounded-full">
                                      {clientOrdersCount}
                                    </span>
                                  )}
                                </div>
                                <div className="text-[10px] text-stone-500 font-normal">
                                  Reporte de compras y rastreo GPS en vivo
                                </div>
                              </div>
                            </button>

                            {/* Divisor */}
                            <div className="border-t border-stone-100 my-1"></div>

                            {/* SECCIÓN 3: CERRAR SESIÓN */}
                            <button
                              onClick={() => {
                                setIsProfileMenuOpen(false);
                                handleLogout();
                              }}
                              className="w-full flex items-center gap-3 px-3 py-2 text-red-600 hover:bg-red-50 rounded-xl font-bold transition text-left group"
                            >
                              <span className="w-8 h-8 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-sm group-hover:scale-105 transition">
                                🚪
                              </span>
                              <div className="flex-1">
                                <div className="font-bold text-red-700 leading-tight">Cerrar Sesión</div>
                                <div className="text-[10px] text-red-500/80 font-normal">
                                  Salir de la cuenta de cliente
                                </div>
                              </div>
                            </button>
                          </div>
                        </div>
                      </>
                    )}
                  </div>
                ) : (
                  <button
                    onClick={() => setIsLoginOpen(true)}
                    className="px-3.5 py-2 bg-white hover:bg-stone-50 text-stone-900 font-black rounded-xl text-xs border border-stone-300 shadow-sm transition"
                  >
                    Ingresar
                  </button>
                )}

                {/* Botón Carrito */}
                <button
                  onClick={() => setIsCartOpen(true)}
                  className="relative p-2.5 bg-mass-red hover:bg-red-700 text-white rounded-xl shadow-md transition flex items-center gap-2"
                >
                  <span className="font-black text-xs hidden sm:inline">S/. {totalMercaderia.toFixed(2)}</span>
                  <span>🛒</span>
                  {totalItems > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 bg-stone-950 text-amber-300 text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow">
                      {totalItems}
                    </span>
                  )}
                </button>
              </div>
            </div>

            {/* Sub-Barra de Navegación: Agrandada, restaurada con categorías separadas perfectamente */}
            <div className="bg-white border-t border-b border-amber-200/90 px-4 sm:px-8 py-3.5 shadow-sm min-h-[62px] flex items-center">
              <div className="max-w-7xl mx-auto w-full flex items-center gap-3 sm:gap-4 overflow-x-auto custom-scroll py-1 text-xs sm:text-sm">
                
                {/* 1. Inicio */}
                <button
                  onClick={() => {
                    setSelectedCategory(null);
                    setIsOffersOnly(false);
                    setIsFavoritesOnly(false);
                    setSearchTerm('');
                    setView('catalogo');
                  }}
                  className={`px-4.5 py-2 rounded-full font-bold text-xs sm:text-sm transition shrink-0 ${
                    selectedCategory === null && !isOffersOnly && !isFavoritesOnly && !searchTerm
                      ? 'bg-mass-red text-white shadow-xs font-black'
                      : 'text-stone-700 hover:bg-stone-100 hover:text-stone-950'
                  }`}
                >
                  Inicio
                </button>

                {/* 3. Ofertas Bomba */}
                <button
                  onClick={() => {
                    setIsOffersOnly(!isOffersOnly);
                    setSelectedCategory(null);
                    setIsFavoritesOnly(false);
                    setView('catalogo');
                  }}
                  className={`px-4.5 py-2 rounded-full font-black text-xs sm:text-sm transition shrink-0 flex items-center gap-1.5 ${
                    isOffersOnly
                      ? 'bg-[#ff7332] text-white shadow-xs'
                      : 'text-[#ff7332] hover:bg-orange-50'
                  }`}
                >
                  <span>💥</span>
                  <span>Ofertas Bomba</span>
                </button>

                {/* 3.1 Catálogo General */}
                <button
                  onClick={() => {
                    setSelectedCategory(null);
                    setIsOffersOnly(false);
                    setIsFavoritesOnly(false);
                    setSearchTerm('');
                    setView('catalogo');
                  }}
                  className={`px-4.5 py-2 rounded-full font-extrabold text-xs sm:text-sm transition shrink-0 ${
                    view === 'catalogo' && selectedCategory === null && !isOffersOnly && !isFavoritesOnly
                      ? 'bg-mass-red text-white shadow-xs font-black'
                      : 'text-stone-700 hover:bg-stone-100 hover:text-stone-950'
                  }`}
                >
                  Catálogo
                </button>

                {/* 4. Favoritos ♡ */}
                <button
                  onClick={() => {
                    setIsFavoritesOnly(!isFavoritesOnly);
                    if (!isFavoritesOnly) {
                      setSelectedCategory(null);
                      setIsOffersOnly(false);
                    }
                    setView('catalogo');
                  }}
                  className={`px-4.5 py-2 rounded-full font-bold text-xs sm:text-sm transition shrink-0 flex items-center gap-1.5 ${
                    isFavoritesOnly
                      ? 'bg-red-50 text-mass-red shadow-xs font-black'
                      : 'text-stone-700 hover:bg-stone-100 hover:text-stone-950'
                  }`}
                  title="Ver mis productos favoritos"
                >
                  <span>{isFavoritesOnly ? '❤️' : '♡'}</span>
                  <span>Favoritos</span>
                  {favorites.length > 0 && (
                    <span className={`text-[10px] font-black px-1.5 py-0.2 rounded-full ${isFavoritesOnly ? 'bg-white text-red-600' : 'bg-red-500 text-white'}`}>
                      {favorites.length}
                    </span>
                  )}
                </button>

                {/* Separador vertical limpio y perfectamente espaciado */}
                <div className="h-6 w-px bg-stone-300 shrink-0 mx-2 sm:mx-3"></div>

                {/* 5. Categorías dinámicas */}
                {categorias.map(cat => {
                  const isActive = selectedCategory === cat.id && !isOffersOnly && !isFavoritesOnly;
                  return (
                    <button
                      key={cat.id}
                      onClick={() => {
                        setSelectedCategory(selectedCategory === cat.id ? null : cat.id);
                        setIsOffersOnly(false);
                        setIsFavoritesOnly(false);
                        setView('catalogo');
                      }}

    // ==========================================
    // CARRUSEL DINÁMICO DE BANNERS COMERCIALES
    // Sincronización automática de 5s, navegación circular y accesibilidad WCAG
    // ==========================================
    function BannerCarouselCliente({ branch, onCtaClick }) {
      const [banners, setBanners] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPaused, setIsPaused] = useState(false);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        let isMounted = true;
        setLoading(true);
        const url = branch?.id ? `/banners?sucursal_id=${branch.id}` : '/banners';
        api.get(url).then(res => {
          if (isMounted) {
            setBanners(res.data?.data || res.data || []);
            setCurrentIndex(0);
          }
        }).catch(err => {
          console.error('Error al cargar banners:', err);
        }).finally(() => {
          if (isMounted) setLoading(false);
        });
        return () => { isMounted = false; };
      }, [branch?.id]);

      // Rotación automática cada 5 segundos estrictamente sincronizada
      // Al cambiar currentIndex (por clic en flechas o dots), el timer se reinicia de inmediato
      useEffect(() => {
        if (banners.length <= 1 || isPaused) return;
        const timer = setInterval(() => {
          setCurrentIndex(prev => (prev + 1) % banners.length);
        }, 5000);
        return () => clearInterval(timer);
      }, [banners.length, isPaused, currentIndex]);

      const handlePrev = () => {
        setCurrentIndex(prev => (prev - 1 + banners.length) % banners.length);
      };

      const handleNext = () => {
        setCurrentIndex(prev => (prev + 1) % banners.length);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          handlePrev();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          handleNext();
        }
      };

      if (loading) {
        return <div className="w-full h-64 sm:h-72 md:h-84 rounded-3xl bg-stone-200 animate-pulse mb-6"></div>;
      }
      if (banners.length === 0) return null;

      return (
        <div
          tabIndex={0}
          onKeyDown={handleKeyDown}
          className="relative w-full overflow-hidden rounded-3xl md:rounded-[2rem] shadow-md border border-stone-200/80 bg-stone-900 select-none group mb-6 focus:outline-none focus:ring-2 focus:ring-mass-yellow/60"
          onMouseEnter={() => setIsPaused(true)}
          onMouseLeave={() => setIsPaused(false)}
          role="region"
          aria-roledescription="carrusel"
          aria-label="Carrusel de promociones y ofertas destacadas"
        >
          <div className="relative w-full h-64 sm:h-72 md:h-84">
            {banners.map((item, idx) => (
              <div
                key={item.id || idx}
                className={`absolute inset-0 transition-opacity duration-700 ease-in-out ${
                  idx === currentIndex ? 'opacity-100 z-10 pointer-events-auto' : 'opacity-0 z-0 pointer-events-none'
                }`}
                aria-hidden={idx !== currentIndex}
              >
                <img
                  src={item.imagen_url}
                  alt={item.titulo}
                  className="absolute inset-0 w-full h-full object-cover object-center transition-transform duration-700 transform scale-100 group-hover:scale-102"
                />
                <div className="absolute inset-0 bg-gradient-to-r from-stone-950/90 via-stone-950/60 to-transparent"></div>

                <div className="relative h-full max-w-7xl mx-auto px-6 sm:px-12 flex flex-col justify-center items-start text-white space-y-2 sm:space-y-3 z-10 max-w-2xl">
                  {item.tag_promocion && (
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] sm:text-xs font-black uppercase tracking-wider bg-mass-red text-white shadow-md">
                      <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12.7 2.3A1 1 0 0 0 12 2H4a2 2 0 0 0-2 2v8a1 1 0 0 0 .3.7l10 10a1 1 0 0 0 1.4 0l8-8a1 1 0 0 0 0-1.4l-9-9zM6.5 8C5.7 8 5 7.3 5 6.5S5.7 5 6.5 5 8 5.7 8 6.5 7.3 8 6.5 8z"/></svg>
                      <span>{item.tag_promocion}</span>
                    </span>
                  )}
                  <h2 className="text-xl sm:text-3xl md:text-4xl font-black text-white tracking-tight leading-tight drop-shadow-sm">
                    {item.titulo}
                  </h2>
                  {item.subtitulo && (
                    <p className="text-xs sm:text-sm text-stone-200 line-clamp-2 max-w-xl font-medium leading-relaxed drop-shadow">
                      {item.subtitulo}
                    </p>
                  )}
                  <div className="pt-2 flex items-center gap-3 flex-wrap">
                    {item.precio_destacado && (
                      <span className="text-xs sm:text-sm font-black text-mass-yellow drop-shadow-sm bg-black/50 backdrop-blur-xs px-3.5 py-2 rounded-xl border border-amber-400/40 uppercase tracking-wide">
                        {item.precio_destacado}
                      </span>
                    )}
                    <button
                      type="button"
                      onClick={() => onCtaClick ? onCtaClick(item) : window.location.assign(item.boton_enlace || '#catalogo-grid')}
                      className="px-5 py-2.5 sm:px-6 sm:py-3 bg-mass-yellow hover:bg-amber-400 text-stone-950 font-black text-xs sm:text-sm rounded-xl shadow-lg transition transform active:scale-95 flex items-center gap-2 uppercase tracking-wide border border-amber-300 cursor-pointer"
                    >
                      <span>{item.boton_texto || 'Aprovechar Ofertas'}</span>
                      <span className="text-sm font-bold">➔</span>
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {banners.length > 1 && (
            <>
              {/* Botón Circular Anterior */}
              <button
                type="button"
                onClick={handlePrev}
                aria-label="Banner anterior"
                className="absolute left-3 sm:left-4 top-1/2 -translate-y-1/2 w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/90 hover:bg-white text-stone-900 flex items-center justify-center shadow-lg backdrop-blur-xs transition transform hover:scale-105 active:scale-95 z-20 font-black text-xl cursor-pointer border border-stone-200/40 focus:outline-none focus:ring-2 focus:ring-mass-yellow"
              >
                ‹
              </button>

              {/* Botón Circular Siguiente */}
              <button
                type="button"
                onClick={handleNext}
                aria-label="Siguiente banner"
                className="absolute right-3 sm:right-4 top-1/2 -translate-y-1/2 w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/90 hover:bg-white text-stone-900 flex items-center justify-center shadow-lg backdrop-blur-xs transition transform hover:scale-105 active:scale-95 z-20 font-black text-xl cursor-pointer border border-stone-200/40 focus:outline-none focus:ring-2 focus:ring-mass-yellow"
              >
                ›
              </button>

              {/* Cápsula de Indicadores Inferiores */}
              <div
                role="tablist"
                aria-label="Diapositivas del carrusel"
                className="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 z-20 bg-stone-950/70 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/10 shadow-lg"
              >
                {banners.map((_, idx) => (
                  <button
                    key={idx}
                    type="button"
                    role="tab"
                    aria-selected={currentIndex === idx}
                    aria-label={`Ir al banner ${idx + 1}`}
                    onClick={() => setCurrentIndex(idx)}
                    className={`transition-all duration-300 rounded-full cursor-pointer focus:outline-none focus:ring-1 focus:ring-mass-yellow ${
                      currentIndex === idx ? 'w-7 h-2 bg-mass-yellow shadow' : 'w-2 h-2 bg-white/40 hover:bg-white/80'
                    }`}
                  />
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

    // ==========================================
    // PANEL DE ACCESIBILIDAD WEB (WCAG 2.1 AA)
    // Conectado al motor modular /frontend/js/accessibility.js
    // ==========================================
    function AccessibilityWidget() {
      const [isOpen, setIsOpen] = useState(false);
      const [a11yState, setA11yState] = useState(() => {
        return window.MassA11y ? window.MassA11y.getState() : {
          fontSize: 'normal',
          contrast: 'normal',
          highFocus: false
        };
      });

      useEffect(() => {
        if (window.MassA11y) {
          return window.MassA11y.subscribe(setA11yState);
        }
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isOpen) setIsOpen(false);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen]);

      const handleFontSize = (size) => {
        if (window.MassA11y) window.MassA11y.setFontSize(size);
      };

      const handleContrast = (mode) => {
        if (window.MassA11y) window.MassA11y.setContrast(mode);
      };

      const handleHighFocus = (checked) => {
        if (window.MassA11y) window.MassA11y.setHighFocus(checked);
      };

      const handleReset = () => {
        if (window.MassA11y) window.MassA11y.reset();
      };

      return (
        <>
          <button
            onClick={() => setIsOpen(!isOpen)}
            aria-label="Abrir panel de accesibilidad"
            aria-expanded={isOpen}
            data-a11y-keep="true"
            className="fixed bottom-5 left-5 z-40 bg-stone-900 hover:bg-black text-mass-yellow p-3 rounded-full shadow-2xl border-2 border-amber-400 focus:outline-none focus:ring-4 focus:ring-amber-300 transition transform hover:scale-110 active:scale-95 flex items-center justify-center font-extrabold text-sm"
            title="Herramientas de Accesibilidad (WCAG 2.1 AA)"
          >
            👁️
          </button>

          {isOpen && (
            <div
              id="a11y-widget-panel"
              className="fixed bottom-20 left-5 z-50 w-80 sm:w-96 rounded-3xl shadow-2xl p-5 space-y-4 text-xs animate-in zoom-in-95 duration-200"
              role="dialog"
              aria-modal="true"
              aria-label="Herramientas de Accesibilidad Web"
            >
              <div className="flex items-center justify-between pb-3 border-b border-stone-200">
                <div className="flex items-center gap-2">
                  <span className="text-lg">♿</span>
                  <div>
                    <h3 className="font-extrabold text-stone-900 text-sm">Accesibilidad Web</h3>
                    <p className="text-[10px] text-stone-500 font-medium">Estándar WCAG 2.1 Nivel AA</p>
                  </div>
                </div>
                <button
                  onClick={() => setIsOpen(false)}
                  aria-label="Cerrar panel de accesibilidad"
                  data-a11y-keep="true"
                  className="w-7 h-7 rounded-full bg-stone-100 hover:bg-stone-200 font-bold flex items-center justify-center"
                >
                  ✕
                </button>
              </div>

              {/* 1. Tamaño del Texto */}
              <div className="space-y-1.5">
                <label className="font-bold text-stone-800 flex items-center gap-1.5">
                  <span>🔤 Tamaño del Texto</span>
                </label>
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { id: 'normal', label: 'Normal' },
                    { id: 'large', label: '115% +' },
                    { id: 'xlarge', label: '125% ++' }
                  ].map((item) => (
                    <button
                      key={item.id}
                      onClick={() => handleFontSize(item.id)}
                      data-a11y-keep="true"
                      className={`py-2 px-1 rounded-xl text-center font-bold border transition ${
                        a11yState.fontSize === item.id
                          ? 'bg-mass-yellow text-stone-950 border-2 border-stone-900 font-black shadow-sm ring-2 ring-amber-300'
                          : 'bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100'
                      }`}
                    >
                      {a11yState.fontSize === item.id ? '✓ ' : ''}{item.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* 2. Contraste Visual */}
              <div className="space-y-1.5">
                <label className="font-bold text-stone-800 flex items-center gap-1.5">
                  <span>🎨 Contraste Visual</span>
                </label>
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { id: 'normal', label: 'Estándar' },
                    { id: 'high', label: 'Alto Contraste' },
                    { id: 'grayscale', label: 'Gris' }
                  ].map((item) => (
                    <button
                      key={item.id}
                      onClick={() => handleContrast(item.id)}
                      data-a11y-keep="true"
                      className={`py-2 px-1 rounded-xl text-center font-bold border transition ${
                        a11yState.contrast === item.id
                          ? 'bg-mass-yellow text-stone-950 border-2 border-stone-900 font-black shadow-sm ring-2 ring-amber-300'
                          : 'bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100'
                      }`}
                    >
                      {a11yState.contrast === item.id ? '✓ ' : ''}{item.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* 3. Resaltar Foco Teclado */}
              <div className="pt-1">
                <label className="flex items-center justify-between p-2.5 rounded-2xl bg-stone-50 border border-stone-200 cursor-pointer hover:bg-stone-100 select-none">
                  <div>
                    <span className="font-bold text-stone-900 block">Resaltar Foco Teclado</span>
                    <span className="text-[10px] text-stone-500">Bordes visibles con Tab</span>
                  </div>
                  <input
                    type="checkbox"
                    checked={a11yState.highFocus}
                    onChange={(e) => handleHighFocus(e.target.checked)}
                    className="w-4 h-4 text-mass-red accent-mass-red rounded cursor-pointer"
                  />
                </label>
              </div>

              {/* 4. Restablecer y Cerrar */}
              <div className="pt-2 border-t border-stone-100 flex justify-between items-center">
                <button
                  type="button"
                  onClick={handleReset}
                  data-a11y-keep="true"
                  className="text-stone-500 hover:text-mass-red font-bold text-[11px]"
                >
                  Restablecer
                </button>
                <button
                  type="button"
                  onClick={() => setIsOpen(false)}
                  data-a11y-keep="true"
                  className="px-4 py-1.5 bg-mass-yellow text-stone-950 font-black rounded-xl text-xs hover:bg-amber-400 transition"
                >
                  Listo
                </button>
              </div>
            </div>
          )}
        </>
      );
    }

    // ==========================================
    // 1. CATÁLOGO DEL CLIENTE CON FILTROS LATERALES
    // ==========================================
    const POPULAR_BRANDS = [
      'PRIMOR', 'COSTEÑO', 'GLORIA', 'MASS', 'CAMPO MASS',
      'BOLÍVAR', 'INKA KOLA', 'LA CALERA', 'ALTOMAYO', 'DON VITTORIO', 'LAIVE', 'COSTENITO'
    ];

    function detectBrand(name) {
      const upper = (name || '').toUpperCase();
      for (const b of POPULAR_BRANDS) {
        if (upper.includes(b)) return b;
      }
      return 'MASS';
    }

    function CatalogoCliente({
      branch,
      searchTerm,
      isSearching = false,
      selectedCategory,
      setSelectedCategory,
      isOffersOnly,
      setIsOffersOnly,
      isFavoritesOnly,
      favorites,
      onToggleFavorite,
      onClearFilters,
      onAddToCart,
      onGoCheckout
    }) {
      const [productos, setProductos] = useState([]);
      const [categorias, setCategorias] = useState([]);
      const [loading, setLoading] = useState(true);
      const [networkLoading, setNetworkLoading] = useState(false);
      const searchAbortRef = useRef(null);

      // Filtros internos
      const [catalogSearch, setCatalogSearch] = useState('');
      const [minPrice, setMinPrice] = useState(0);
      const [maxPrice, setMaxPrice] = useState(40);
      const [selectedBrands, setSelectedBrands] = useState([]);
      const [withStock, setWithStock] = useState(true);
      const [lowStock, setLowStock] = useState(true);
      const [shortRotation, setShortRotation] = useState(false);
      const [sortBy, setSortBy] = useState('relevancia');
      const [quickFilter, setQuickFilter] = useState('todos');
      const [isMobileFiltersOpen, setIsMobileFiltersOpen] = useState(false);

      // Cantidades locales por producto
      const [localQtys, setLocalQtys] = useState({});

      // Modal de Detalle de Producto al tocar cualquier producto
      const [selectedProductModal, setSelectedProductModal] = useState(null);
      const [modalQty, setModalQty] = useState(1);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && selectedProductModal) {
            setSelectedProductModal(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [selectedProductModal]);

      // Carga de catálogo con control de concurrencia y AbortController
      // Cancela solicitudes previas en vuelo para evitar condiciones de carrera
      useEffect(() => {
        if (!branch?.id) return;

        if (searchAbortRef.current) {
          searchAbortRef.current.abort();
        }

        const controller = new AbortController();
        searchAbortRef.current = controller;
        setNetworkLoading(true);

        const params = new URLSearchParams();
        params.append('sucursal_id', branch.id);
        if (selectedCategory) params.append('categoria_id', selectedCategory);
        if (searchTerm && searchTerm.trim() !== '') {
          params.append('search', searchTerm.trim());
        }

        Promise.all([
          api.get(`/productos?${params.toString()}`, { signal: controller.signal }),
          categorias.length === 0 ? api.get('/categorias') : Promise.resolve({ data: categorias })
        ]).then(([prodRes, catRes]) => {
          setProductos(prodRes.data?.data || prodRes.data || []);
          if (catRes.data && categorias.length === 0) setCategorias(catRes.data || []);
        }).catch(err => {
          if (err.name === 'AbortError' || err.code === 'ERR_CANCELED') return;
          console.error('Error al cargar catálogo:', err);
        }).finally(() => {
          if (searchAbortRef.current === controller) {
            setNetworkLoading(false);
            setLoading(false);
          }
        });

        return () => {
          controller.abort();
        };
      }, [branch?.id, selectedCategory, searchTerm]);

      // Apertura automática si viene el parámetro ?producto=id en la URL
      useEffect(() => {
        const prodParam = new URLSearchParams(window.location.search).get('producto');
        if (prodParam && productos.length > 0) {
          const found = productos.find(p => String(p.id) === String(prodParam) || String(p.codigo_sku).toLowerCase() === String(prodParam).toLowerCase());
          if (found) {
            setSelectedProductModal(found);
            setModalQty(1);
          }
        }
      }, [productos]);

      // Conteo dinámico de productos por categoría
      const categoryCounts = useMemo(() => {
        const counts = {};
        productos.forEach(p => {
          const cid = p.categoria_id;
          counts[cid] = (counts[cid] || 0) + 1;
        });
        return counts;
      }, [productos]);

      const toggleBrand = (b) => {
        setSelectedBrands(prev =>
          prev.includes(b) ? prev.filter(x => x !== b) : [...prev, b]
        );
      };

      const updateLocalQty = (productId, delta, maxStock) => {
        if (maxStock !== undefined && maxStock <= 0) return;
        setLocalQtys(prev => {
          const cur = prev[productId] || 1;
          const next = cur + delta;
          if (next < 1) return { ...prev, [productId]: 1 };
          if (maxStock !== undefined && next > maxStock) {
            alert("Disponibilidad máxima en esta sede: " + maxStock + " unidades.");
            return { ...prev, [productId]: maxStock };
          }
          return { ...prev, [productId]: next };
        });
      };

      const handleResetAllFilters = () => {
        setCatalogSearch('');
        setMinPrice(0);
        setMaxPrice(40);
        setSelectedBrands([]);
        setWithStock(true);
        setLowStock(true);
        setShortRotation(false);
        setQuickFilter('todos');
        if (setSelectedCategory) setSelectedCategory(null);
        if (setIsOffersOnly) setIsOffersOnly(false);
        onClearFilters();
      };

      // Filtrado exhaustivo y ordenamiento
      const filteredProducts = useMemo(() => {
        return productos.filter(p => {
          const stock = parseInt(p.stock_actual || 0);
          const price = parseFloat(p.precio_venta || 0);
          const brand = detectBrand(p.nombre);

          // 1. Categoría
          if (selectedCategory && parseInt(p.categoria_id) !== parseInt(selectedCategory)) {
            return false;
          }

          // 2. Buscador del Header Principal
          if (searchTerm && searchTerm.trim() !== '') {
            const q = searchTerm.toLowerCase().trim();
            const matchName = (p.nombre || '').toLowerCase().includes(q);
            const matchSku = (p.codigo_sku || '').toLowerCase().includes(q);
            const matchCat = (p.categoria_nombre || '').toLowerCase().includes(q);
            if (!matchName && !matchSku && !matchCat) return false;
          }

          // 3. Buscador interno del Catálogo
          if (catalogSearch && catalogSearch.trim() !== '') {
            const q = catalogSearch.toLowerCase().trim();
            const matchName = (p.nombre || '').toLowerCase().includes(q);
            const matchSku = (p.codigo_sku || '').toLowerCase().includes(q);
            const matchBrand = brand.toLowerCase().includes(q);
            if (!matchName && !matchSku && !matchBrand) return false;
          }

          // 4. Rango de Precio
          if (minPrice !== '' && !isNaN(minPrice) && price < parseFloat(minPrice)) return false;
          if (maxPrice !== '' && !isNaN(maxPrice) && price > parseFloat(maxPrice)) return false;

          // 5. Marcas Populares
          if (selectedBrands.length > 0 && !selectedBrands.includes(brand)) {
            return false;
          }

          // 6. Disponibilidad en Tienda
          if (!withStock && !lowStock) return false;
          if (!withStock && stock > 10) return false;
          if (!lowStock && stock <= 10 && stock > 0) return false;
          if (stock <= 0 && (!withStock && !lowStock)) return false;

          // 7. Consumo Responsable (Lotes corta rotación / PEPS)
          if (shortRotation && p.es_perecedero !== 1) {
            return false;
          }

          // 8. Quick Filter y Ofertas Bomba
          if (isOffersOnly || quickFilter === 'ofertas') {
            if (!(price <= 6.00 || p.es_perecedero === 1)) return false;
          } else if (quickFilter === 'precio_bajo') {
            if (price > 6.00) return false;
          } else if (quickFilter === 'mas_vendidos') {
            if (stock < 50) return false;
          }

          // 9. Mis Favoritos
          if (isFavoritesOnly && !favorites.includes(p.id)) {
            return false;
          }

          return true;
        }).sort((a, b) => {
          if (sortBy === 'menor_precio') return parseFloat(a.precio_venta) - parseFloat(b.precio_venta);
          if (sortBy === 'mayor_precio') return parseFloat(b.precio_venta) - parseFloat(a.precio_venta);
          if (sortBy === 'nombre_asc') return (a.nombre || '').localeCompare(b.nombre || '');
          return 0; // Relevancia
        });
      }, [
        productos,
        selectedCategory,
        searchTerm,
        catalogSearch,
        minPrice,
        maxPrice,
        selectedBrands,
        withStock,
        lowStock,
        shortRotation,
        quickFilter,
        isOffersOnly,
        isFavoritesOnly,
        favorites,
        sortBy
      ]);

      const activeCatObj = categorias.find(c => c.id === selectedCategory);
      const hasAnyActiveFilter = selectedCategory !== null || isOffersOnly || isFavoritesOnly ||
        (searchTerm && searchTerm.trim() !== '') || (catalogSearch && catalogSearch.trim() !== '') ||
        selectedBrands.length > 0 || shortRotation || quickFilter !== 'todos' ||
        minPrice > 0 || maxPrice < 40 || !withStock || !lowStock;

return (
        <div className="space-y-5">
          {/* Banner Principal Dinámico de Ofertas */}
          {!selectedCategory && !isOffersOnly && !isFavoritesOnly && !searchTerm && !catalogSearch && (
            <BannerCarouselCliente
              branch={branch}
              onCtaClick={() => {
                const el = document.getElementById("catalogo-grid");
                if (el) el.scrollIntoView({ behavior: "smooth" });
              }}
            />
          )}

          {/* Breadcrumb de Navegación */}
          <nav className="flex items-center gap-1.5 text-xs text-stone-500 font-semibold">
            <button
              onClick={handleResetAllFilters}
              className="hover:text-mass-red transition"
            >
              Inicio
            </button>
            <span className="text-stone-300">›</span>
            <button
              onClick={() => {
                if (setSelectedCategory) setSelectedCategory(null);
                if (setIsOffersOnly) setIsOffersOnly(false);
              }}
              className="hover:text-mass-red transition"
            >
              Catálogo de Productos
            </button>
            <span className="text-stone-300">›</span>
            <span className="text-mass-red font-black">
              {activeCatObj ? activeCatObj.nombre : isOffersOnly ? 'Ofertas Bomba' : 'Todas las categorías'}
            </span>
          </nav>

          {/* Título Principal y Acceso a Filtros */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
            <div>
              <div className="flex items-center gap-3 flex-wrap">
                <h1 className="text-2xl sm:text-3xl font-black text-stone-900 tracking-tight">
                  Catálogo General de Productos
                </h1>
                <span className="text-xs font-bold bg-white text-stone-600 px-3 py-1 rounded-full border border-stone-200 shadow-2xs">
                  {filteredProducts.length} productos
                </span>
                {hasAnyActiveFilter && (
                  <button
                    onClick={handleResetAllFilters}
                    className="text-xs font-bold text-mass-red hover:underline ml-1"
                  >
                    ✕ Limpiar filtros
                  </button>
                )}
              </div>
              <p className="text-xs text-stone-500 font-medium mt-1">
                Todos los productos disponibles con precios bajos garantizados y control de frescura PEPS
              </p>
            </div>
          </div>

          {/* Catálogo Completo a Ancho Completo */}
          <section className="w-full space-y-4">
              
              {/* Grilla de Productos a Ancho Completo */}
              {loading ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 animate-pulse">
                  {[1, 2, 3, 4, 5, 6, 7, 8].map(n => (
                    <div key={n} className="bg-white rounded-2xl p-4 h-80 border border-stone-200"></div>
                  ))}
                </div>
              ) : filteredProducts.length > 0 ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                  {filteredProducts.map((p, idx) => {
                    const stock = parseInt(p.stock_actual || 0);
                    const isFav = favorites.includes(p.id);
                    const brand = detectBrand(p.nombre);
                    const cardQty = localQtys[p.id] || 1;
                    const priceNum = parseFloat(p.precio_venta || 0);
                    const origPrice = (priceNum * 1.25).toFixed(2);

                    const isAgotado = stock <= 0;
                    const isBajoStock = stock > 0 && stock <= 10;

                    // Determinación de etiqueta destacada según reglas de stock
                    let badgeNode = null;
                    if (isAgotado) {
                      badgeNode = (
                        <span className="bg-red-600 text-white text-[9px] font-black px-2 py-0.5 rounded uppercase shadow-xs">
                          PRODUCTO AGOTADO
                        </span>
                      );
                    } else if (isBajoStock) {
                      badgeNode = (
                        <span className="bg-amber-500 text-stone-950 text-[9px] font-black px-2 py-0.5 rounded uppercase shadow-xs">
                          ¡ÚLTIMAS {stock}!
                        </span>
                      );
                    } else if (priceNum <= 6.00) {
                      badgeNode = (
                        <span className="bg-[#ff671f] text-white text-[9px] font-black px-2 py-0.5 rounded uppercase shadow-xs">
                          -22% OFERTA
                        </span>
                      );
                    } else if (stock >= 80) {
                      badgeNode = (
                        <span className="bg-stone-900 text-mass-yellow text-[9px] font-black px-2 py-0.5 rounded uppercase shadow-xs">
                          MÁS VENDIDO
                        </span>
                      );
                    } else if (p.es_perecedero === 1) {
                      badgeNode = (
                        <span className="bg-emerald-600 text-white text-[9px] font-black px-2 py-0.5 rounded uppercase shadow-xs">
                          COSECHA HOY
                        </span>
                      );
                    }

                    // Elemento del banner publicitario (después de la primera fila completa de 4 productos)
                    const bannerNode = idx === 4 ? (
                      <div key="promo-banner" className="col-span-full bg-gradient-to-r from-amber-50 via-yellow-50 to-orange-50 border border-amber-200/90 rounded-2xl p-5 flex flex-col md:flex-row items-center justify-between gap-4 my-2 shadow-2xs">
                        <div className="space-y-1 text-center md:text-left">
                          <h4 className="font-black text-base text-stone-900 flex items-center gap-2 justify-center md:justify-start">
                            <span>⚡</span>
                            <span>Aprovecha más con Lotes de Corto Vencimiento</span>
                          </h4>
                          <p className="text-xs text-stone-600 font-medium">
                            Calidad 100% garantizada y hasta 50% de descuento. Productos frescos con consumo responsable.
                          </p>
                        </div>
                        <button
                          onClick={() => {
                            setShortRotation(true);
                            setQuickFilter('ofertas');
                          }}
                          className="px-5 py-2.5 bg-mass-red hover:bg-red-700 text-white text-xs font-black rounded-xl shadow-xs transition flex items-center gap-2 shrink-0 uppercase tracking-wide"
                        >
                          <span>Ver Productos Aprovecha</span>
                          <span>➔</span>
                        </button>
                      </div>
                    ) : null;

                    return (
                      <React.Fragment key={p.id}>
                        {bannerNode}
                        <div
                          onClick={() => {
                            setModalQty(localQtys[p.id] || 1);
                            setSelectedProductModal(p);
                          }}
                          className="bg-white rounded-2xl border border-stone-200/90 p-4 shadow-2xs hover:shadow-lg hover:border-amber-400 transition-all duration-200 flex flex-col justify-between group relative h-full cursor-pointer"
                        >
                          
                          {/* Badges y Botón Favoritos */}
                          <div className="flex items-center justify-between absolute top-3.5 left-3.5 right-3.5 z-10 pointer-events-none">
                            <div className="pointer-events-auto">
                              {badgeNode}
                            </div>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                onToggleFavorite(p.id);
                              }}
                              className={`pointer-events-auto w-7 h-7 rounded-full flex items-center justify-center text-xs shadow-xs transition border ${
                                isFav ? 'bg-red-50 text-red-600 border-red-200' : 'bg-white/95 text-stone-400 hover:text-red-500 border-stone-200'
                              }`}
                              title={isFav ? 'Quitar de favoritos' : 'Guardar en favoritos'}
                            >
                              {isFav ? '❤️' : '♡'}
                            </button>
                          </div>

                          {/* Imagen del Producto */}
                          <div className="w-full h-44 rounded-xl overflow-hidden bg-stone-50/80 border border-stone-100 flex items-center justify-center mb-3 p-3 pt-4 relative">
                            <img
                              src={p.imagen_url || 'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300'}
                              alt={p.nombre}
                              className={`max-h-full max-w-full object-contain transition-transform duration-300 ${isAgotado ? "grayscale contrast-75" : "group-hover:scale-105"}`}
                            />
                            {isAgotado && (
                              <div className="absolute inset-0 bg-stone-950/40 flex items-center justify-center">
                                <span className="px-3 py-1 bg-red-600 text-white font-black text-xs rounded-xl shadow-md uppercase">Sin Stock</span>
                              </div>
                            )}
                          </div>

                          {/* Disponibilidad y Detalles */}
                          <div className="space-y-1.5 flex-1 flex flex-col justify-start">
                            <div className="flex items-center gap-1.5 text-[11px] text-stone-500 font-medium">
                              <span className={`w-2 h-2 rounded-full inline-block ${stock > 10 ? 'bg-emerald-500' : stock > 0 ? 'bg-amber-500' : 'bg-red-500'}`}></span>
                              <span className={isAgotado ? "text-red-600 font-bold" : isBajoStock ? "text-amber-700 font-bold" : "text-stone-500 font-medium"}>
                                {isAgotado ? "Producto agotado en tienda" : isBajoStock ? `¡Solo ${stock} disponibles en ${branch?.nombre?.replace("Tienda Mass - ", "") || "sede"}!` : `${stock} unidades disponibles`}
                              </span>
                            </div>

                            <div className="text-[10px] text-stone-400 font-extrabold uppercase tracking-wider">
                              {brand} / {(p.categoria_nombre || 'GENERAL').toUpperCase()}
                            </div>

                            <h3 className="font-bold text-stone-900 text-sm line-clamp-2 leading-snug min-h-[2.5rem] group-hover:text-mass-red transition-colors">
                              {p.nombre}
                            </h3>

                            <div className="text-xs text-stone-500 font-medium">
                              {p.unidad_medida || 'Unidad'}
                            </div>
                          </div>

                          {/* Precios y Botón de Agregar (Con Rojo y Amarillo Mass) */}
                          <div className="mt-auto pt-3 border-t border-stone-100 flex flex-col gap-2.5">
                            <div className="flex items-baseline gap-2">
                              <span className="text-base sm:text-lg font-black text-mass-red">
                                S/ {priceNum.toFixed(2)}
                              </span>
                              <span className="text-xs text-stone-400 line-through font-semibold">
                                S/ {origPrice}
                              </span>
                            </div>

                            <div className="flex items-center gap-2">
                              <div className="flex items-center border border-stone-200 rounded-xl bg-stone-50 px-2 py-1 shrink-0">
                                <button
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    updateLocalQty(p.id, -1);
                                  }}
                                  className="text-stone-500 hover:text-stone-800 font-bold px-1.5 text-xs"
                                >
                                  -
                                </button>
                                <span className="text-xs font-black text-stone-900 w-5 text-center">
                                  {cardQty}
                                </span>
                                <button
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    updateLocalQty(p.id, 1);
                                  }}
                                  className="text-stone-500 hover:text-stone-800 font-bold px-1.5 text-xs"
                                >
                                  +
                                </button>
                              </div>

                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  onAddToCart(p, cardQty);
                                }}
                                disabled={stock <= 0}
                                className="flex-1 py-2.5 bg-mass-yellow hover:bg-yellow-400 text-stone-950 text-xs font-black rounded-xl shadow-xs transition flex items-center justify-center gap-1.5 border border-yellow-300 active:scale-95 disabled:bg-stone-200 disabled:text-stone-400 disabled:border-transparent disabled:cursor-not-allowed"
                              >
                                <span>{stock > 0 ? '🛒 Agregar' : 'Agotado'}</span>
                              </button>
                            </div>
                          </div>
                        </div>
                      </React.Fragment>
                    );
                  })}
                </div>
              ) : (
                <div className="bg-white p-12 rounded-3xl border border-stone-200 text-center space-y-3">
                  <span className="text-4xl">🔍</span>
                  <h3 className="text-sm font-bold text-stone-900">
                    {debouncedSearch ? 'No se encontraron productos' : 'No encontramos productos con esos filtros'}
                  </h3>
                  <p className="text-xs text-stone-500 max-w-md mx-auto">
                    {debouncedSearch 
                      ? 'No encontramos productos que coincidan con tu búsqueda. Verifica el nombre o intenta con otra palabra.' 
                      : 'Prueba cambiando el rango de precio, marcas o limpiando los filtros seleccionados.'}
                  </p>
                  <button
                    onClick={handleResetAllFilters}
                    className="px-5 py-2.5 bg-mass-yellow hover:bg-amber-400 text-stone-950 font-black rounded-xl text-xs shadow-xs transition border border-amber-300"
                  >
                    {debouncedSearch ? 'Limpiar búsqueda y volver a mostrar el catálogo' : `Ver Todos los Productos (${allProducts.length})`}
                  </button>
                </div>
              )}
            </section>

          {/* Modal de Detalle de Producto al seleccionar o tocar cualquier producto */}
          {selectedProductModal && (() => {
            const p = selectedProductModal;
            const stock = parseInt(p.stock_actual || 0);
            const isFav = favorites.includes(p.id);
            const brand = detectBrand(p.nombre);
            const priceNum = parseFloat(p.precio_venta || 0);
            const origPrice = (priceNum * 1.25).toFixed(2);
            const subtotal = (priceNum * modalQty).toFixed(2);

            let badgeLabel = 'MÁS VENDIDO';
            let badgeClass = 'bg-[#1b4d3e] text-white';
            if (priceNum <= 6.00) {
              badgeLabel = '-22% OFERTA';
              badgeClass = 'bg-[#ff671f] text-white';
            } else if ((p.nombre || '').toLowerCase().includes('pack') || (p.nombre || '').toLowerCase().includes('5 kg')) {
              badgeLabel = 'AHORRO PACK';
              badgeClass = 'bg-amber-500 text-stone-950';
            }

            return (
              <div
                className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/60 backdrop-blur-xs animate-in fade-in duration-200"
                role="dialog"
                aria-modal="true"
                aria-label={`Detalle del producto ${p.nombre}`}
              >
                <div className="fixed inset-0" onClick={() => setSelectedProductModal(null)}></div>
                
                <div className="relative w-full max-w-4xl bg-white rounded-3xl shadow-2xl border border-stone-200 overflow-hidden max-h-[92vh] flex flex-col z-10 animate-in zoom-in-95 duration-200">
                  
                  {/* Cabecera / Breadcrumb */}
                  <div className="px-5 py-4 border-b border-stone-100 flex items-center justify-between gap-3 bg-stone-50/70">
                    <nav className="flex items-center gap-1.5 text-xs text-stone-500 font-semibold truncate">
                      <span className="hover:text-stone-800">Inicio</span>
                      <span>›</span>
                      <span className="hover:text-stone-800">Catálogo</span>
                      <span>›</span>
                      <span className="hover:text-stone-800">{p.categoria_nombre || 'General'}</span>
                      <span>›</span>
                      <span className="text-stone-900 font-bold truncate">{p.nombre}</span>
                    </nav>
                    <button
                      onClick={() => setSelectedProductModal(null)}
