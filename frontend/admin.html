    function AdminBannersView({ branch, user, sucursales }) {
      const [banners, setBanners] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingBanner, setEditingBanner] = useState(null);
      const [selectedFile, setSelectedFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState('');
      const [isUploading, setIsUploading] = useState(false);
      const fileInputRef = useRef(null);

      const [formData, setFormData] = useState({
        titulo: '', subtitulo: '', tag_promocion: 'OFERTAS BOMBA', precio_destacado: '',
        imagen_url: '', boton_texto: 'Comprar Ahora', boton_enlace: '#catalogo',
        sucursal_id: '', orden: 1, activo: 1, fecha_inicio: '', fecha_fin: ''
      });
      const isAdmin = user?.rol_nombre === 'Administrador';

      const loadBanners = () => {
        setLoading(true);
        api.get('/banners/admin').then(res => {
          setBanners(res.data?.data || res.data || []);
        }).catch(console.error).finally(() => setLoading(false));
      };

      useEffect(() => { loadBanners(); }, []);

      const handleToggle = (id) => {
        api.patch(`/banners/${id}/toggle`).then(() => loadBanners()).catch(err => alert(err.message));
      };

      const handleDelete = (id) => {
        if (!confirm('¿Desea eliminar este banner publicitario?')) return;
        api.delete(`/banners/${id}`).then(() => loadBanners()).catch(err => alert(err.message));
      };

      const handleFileSelect = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const allowedExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'avif', 'svg', 'bmp', 'tiff', 'tif'];
        const ext = file.name.split('.').pop().toLowerCase();

        if (!allowedExtensions.includes(ext)) {
          alert(`Formato no compatible (.${ext}). Por favor seleccione una imagen JPG, PNG, GIF, WebP, AVIF, SVG, BMP o TIFF.`);
          return;
        }

        if (file.size > 8 * 1024 * 1024) {
          alert('La imagen excede el límite máximo permitido de 8 MB.');
          return;
        }

        setSelectedFile(file);
        const objUrl = URL.createObjectURL(file);
        setPreviewUrl(objUrl);
      };

      const handleRemoveSelectedImage = () => {
        setSelectedFile(null);
        if (fileInputRef.current) fileInputRef.current.value = '';
        setPreviewUrl(editingBanner?.imagen_url || '');
      };

      const handleSave = async (e) => {
        e.preventDefault();
        setIsUploading(true);

        try {
          let finalImageUrl = formData.imagen_url;

          // Si el usuario seleccionó un archivo local desde su computadora, subirlo primero
          if (selectedFile) {
            const uploadData = new FormData();
            uploadData.append('banner_image', selectedFile);

            const uploadRes = await axios.post('http://localhost/tiendasmass/backend/public/api/upload/banner', uploadData, {
              headers: {
                'Content-Type': 'multipart/form-data',
                'Authorization': `Bearer ${localStorage.getItem('mass_admin_token')}`
              }
            });

            finalImageUrl = uploadRes.data?.data?.url || uploadRes.data?.url;
          }

          if (!finalImageUrl && !editingBanner) {
            alert('Debe seleccionar obligatoriamente una imagen desde su computadora para el banner.');
            setIsUploading(false);
            return;
          }

          const payload = {
            ...formData,
            imagen_url: finalImageUrl || editingBanner?.imagen_url
          };

          if (!isAdmin && user?.sucursal_id) payload.sucursal_id = user.sucursal_id;

          const action = editingBanner 
            ? api.put(`/banners/${editingBanner.id}`, payload) 
            : api.post('/banners', payload);

          await action;
          setIsModalOpen(false);
          setSelectedFile(null);
          loadBanners();
        } catch (err) {
          alert('Error al guardar el banner: ' + (err.response?.data?.message || err.message));
        } finally {
          setIsUploading(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-3xl border shadow-xs">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-2 bg-amber-100 rounded-xl text-lg">🖼️</span>
                <h1 className="text-xl font-extrabold text-stone-900 tracking-tight">Gestión de Banners Promocionales</h1>
              </div>
              <p className="text-xs text-stone-500 mt-1">
                {isAdmin ? 'Cargue imágenes locales desde su equipo (JPG, PNG, WebP, SVG, AVIF, GIF) para campañas globales o por tienda.' : `Gestione promociones exclusivas para ${user?.sucursal_nombre || 'su sucursal'}.`}
              </p>
            </div>
            <button
              onClick={() => {
                setEditingBanner(null);
                setSelectedFile(null);
                setPreviewUrl('');
                setFormData({
                  titulo: '', subtitulo: '', tag_promocion: 'OFERTAS BOMBA', precio_destacado: '',
                  imagen_url: '', boton_texto: 'Comprar Ahora', boton_enlace: '#catalogo',
                  sucursal_id: !isAdmin ? user?.sucursal_id : '', orden: banners.length + 1, activo: 1,
                  fecha_inicio: '', fecha_fin: ''
                });
                setIsModalOpen(true);
              }}
              className="px-4 py-2.5 bg-mass-yellow hover:bg-amber-400 font-extrabold text-stone-950 rounded-xl text-xs shadow-xs border border-amber-300 flex items-center gap-1.5 transition active:scale-95"
            >
              <span>➕</span>
              <span>Registrar Banner</span>
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {banners.map(b => (
              <div key={b.id} className="bg-white rounded-3xl border overflow-hidden shadow-xs flex flex-col justify-between">
                <div className="relative h-48 bg-stone-900 overflow-hidden group">
                  <img src={b.imagen_url} alt={b.titulo} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                  <div className="absolute inset-0 bg-gradient-to-t from-stone-950/80 via-transparent"></div>
                  <div className="absolute top-3 left-3 right-3 flex justify-between items-center">
                    <span className="px-2.5 py-1 bg-mass-red text-white text-[10px] font-black rounded-full uppercase shadow">
                      {b.tag_promocion}
                    </span>
                    <span className="px-2.5 py-1 bg-stone-900 text-amber-300 text-[10px] font-black rounded-full shadow border border-stone-700">
                      {b.sucursal_id ? `🏢 ${b.sucursal_nombre}` : '🌐 Global'}
                    </span>
                  </div>
                  <div className="absolute bottom-3 left-3 right-3 text-white">
                    <h3 className="font-extrabold text-base leading-tight drop-shadow">{b.titulo}</h3>
                    {b.precio_destacado && <span className="text-xs font-black text-amber-300">{b.precio_destacado}</span>}
                  </div>
                </div>
                <div className="p-4 space-y-3">
                  <p className="text-xs text-stone-600 line-clamp-2">{b.subtitulo}</p>
                  <div className="flex justify-between items-center pt-2 border-t text-xs">
                    <button
                      onClick={() => handleToggle(b.id)}
                      className={`px-2.5 py-0.5 rounded-full font-bold text-[10px] ${b.activo == 1 ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-100 text-stone-400'}`}
                    >
                      {b.activo == 1 ? '● Activo' : '○ Inactivo'}
                    </button>
                    <div className="flex gap-2">
                      <button
                        onClick={() => {
                          setEditingBanner(b);
                          setSelectedFile(null);
                          setPreviewUrl(b.imagen_url || '');
                          setFormData({ ...b });
                          setIsModalOpen(true);
                        }}
                        className="px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-900 rounded-lg text-xs font-bold"
                      >
                        ✏️ Editar
                      </button>
                      <button
                        onClick={() => handleDelete(b.id)}
                        className="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-bold"
                      >
                        ✕ Eliminar
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* MODAL DE CARGA Y EDICIÓN DE BANNER CON VISTA PREVIA */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
              <div className="w-full max-w-xl bg-white rounded-3xl p-6 space-y-4 max-h-[92vh] overflow-y-auto text-xs shadow-2xl">
                <div className="flex justify-between items-center pb-2 border-b">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">🖼️</span>
                    <h2 className="text-base font-extrabold text-stone-900">{editingBanner ? 'Editar Banner Promocional' : 'Registrar Nuevo Banner'}</h2>
                  </div>
                  <button onClick={() => setIsModalOpen(false)} className="text-stone-400 hover:text-stone-800 font-bold">✕</button>
                </div>

                <form onSubmit={handleSave} className="space-y-4">
                  <div>
                    <label className="font-bold block mb-1 text-stone-800">Título de la Promoción *</label>
                    <input
                      type="text"
                      required
                      value={formData.titulo}
                      onChange={e => setFormData({ ...formData, titulo: e.target.value })}
                      placeholder="Ej: Festival de Lácteos y Desayuno"
                      className="w-full p-2.5 border rounded-xl font-bold"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1 text-stone-800">Subtítulo / Mensaje Promocional</label>
                    <textarea
                      rows="2"
                      value={formData.subtitulo || ''}
                      onChange={e => setFormData({ ...formData, subtitulo: e.target.value })}
                      placeholder="Ej: Leche Gloria, quesos frescos y avenas con frescura PEPS garantizada..."
                      className="w-full p-2 border rounded-xl"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold block mb-1 text-stone-800">Tag Promoción</label>
                      <input
                        type="text"
                        value={formData.tag_promocion}
                        onChange={e => setFormData({ ...formData, tag_promocion: e.target.value })}
                        placeholder="Ej: 💥 OFERTAS BOMBA"
                        className="w-full p-2 border rounded-xl font-bold"
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-stone-800">Precio / Descuento Destacado</label>
                      <input
                        type="text"
                        value={formData.precio_destacado || ''}
                        onChange={e => setFormData({ ...formData, precio_destacado: e.target.value })}
                        placeholder="Ej: Hasta 25% DSCTO"
                        className="w-full p-2 border rounded-xl font-bold"
                      />
                    </div>
                  </div>

                  {/* CARGA VISUAL DE IMAGEN DESDE COMPUTADORA (Prompt 2) */}
                  <div className="p-4 bg-stone-50 border-2 border-dashed border-stone-300 rounded-2xl space-y-3">
                    <div className="flex justify-between items-center">
                      <label className="font-extrabold text-stone-900 block">
                        Imagen del Banner (Carga desde tu computadora) *
                      </label>
                      <span className="text-[10px] text-stone-500 font-bold">Máx. 8 MB</span>
                    </div>

                    {/* Vista Previa de la Imagen */}
                    {previewUrl ? (
                      <div className="space-y-2">
                        <div className="relative h-44 rounded-xl overflow-hidden border border-stone-200 bg-stone-950 flex items-center justify-center">
                          <img
                            src={previewUrl}
                            alt="Vista previa del banner"
                            className="w-full h-full object-cover"
                          />
                          <div className="absolute top-2 right-2 flex gap-1.5">
                            <span className="px-2 py-0.5 bg-black/80 text-emerald-400 text-[10px] font-bold rounded-md">
                              ✓ {selectedFile ? `Nueva: ${selectedFile.name}` : 'Imagen Actual'}
                            </span>
                          </div>
                        </div>

                        <div className="flex items-center justify-between pt-1">
                          <button
                            type="button"
                            onClick={() => fileInputRef.current?.click()}
                            className="px-3 py-1.5 bg-stone-900 text-white rounded-lg text-xs font-bold hover:bg-stone-800"
                          >
                            🔄 Cambiar Imagen
                          </button>
                          {selectedFile && (
                            <button
                              type="button"
                              onClick={handleRemoveSelectedImage}
                              className="px-3 py-1.5 bg-red-50 text-red-700 rounded-lg text-xs font-bold border border-red-200 hover:bg-red-100"
                            >
                              ✕ Quitar selección
                            </button>
                          )}
                        </div>
                      </div>
                    ) : (
                      <div className="text-center py-6 space-y-2">
                        <div className="w-12 h-12 mx-auto rounded-full bg-amber-100 text-stone-800 flex items-center justify-center text-xl">
                          📷
                        </div>
                        <div className="font-bold text-stone-800">
                          Seleccione una imagen directamente desde su equipo
                        </div>
                        <p className="text-[11px] text-stone-500">
                          Formatos admitidos: JPG, PNG, GIF, WebP, AVIF, SVG (sanitizado seguro), BMP y TIFF.
                        </p>
                        <button
                          type="button"
                          onClick={() => fileInputRef.current?.click()}
                          className="px-4 py-2 bg-mass-yellow text-stone-950 font-extrabold rounded-xl text-xs border border-amber-300 shadow-xs hover:bg-amber-400"
                        >
                          📁 Explorar en mi computadora
                        </button>
                      </div>
                    )}

                    {/* Input Oculto */}
                    <input
                      type="file"
                      ref={fileInputRef}
                      onChange={handleFileSelect}
                      accept="image/jpeg,image/png,image/gif,image/webp,image/avif,image/svg+xml,image/bmp,image/tiff,.jpg,.jpeg,.png,.gif,.webp,.avif,.svg,.bmp,.tiff,.tif"
                      className="hidden"
                    />

                    <div className="text-[10px] text-stone-400 font-medium">
                      🔒 Validación automática en frontend y backend: tipo MIME real, sanitización SVG y protección contra contenido malicioso.
                    </div>
                  </div>

                  {isAdmin ? (
                    <div>
                      <label className="font-bold block mb-1 text-stone-800">Ámbito de Visualización</label>
                      <select
                        value={formData.sucursal_id || ''}
                        onChange={e => setFormData({ ...formData, sucursal_id: e.target.value })}
                        className="w-full p-2.5 border rounded-xl bg-white font-bold text-stone-900"
                      >
                        <option value="">🌐 Global (Todas las Tiendas Mass)</option>
                        {sucursales.map(s => <option key={s.id} value={s.id}>🏢 Solo {s.nombre}</option>)}
                      </select>
                    </div>
                  ) : (
                    <div className="p-2.5 bg-amber-50 rounded-xl text-stone-800 font-bold border border-amber-200">
                      🏢 Se publicará exclusivamente para su sede asignada.
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-3 border-t">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 border rounded-xl font-bold"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      disabled={isUploading}
                      className="px-5 py-2 bg-mass-yellow font-extrabold text-stone-950 rounded-xl shadow-xs border border-amber-300"
                    >
                      {isUploading ? 'Subiendo imagen...' : 'Guardar Banner'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 8. AUDITORÍA MERMAS NIC 2
    // ==========================================
    function AdminReportesView({ branch }) {
      const [mermas, setMermas] = useState({ total_perdida_soles: 0, detalles: [] });
      useEffect(() => {
        if (!branch?.id) return;
        api.get(`/reportes/mermas?sucursal_id=${branch.id}`).then(r => setMermas(r.data || { total_perdida_soles: 0, detalles: [] }));
      }, [branch]);

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <h1 className="text-xl font-extrabold text-stone-900 tracking-tight">Auditoría de Mermas & Desmedros (NIC 2)</h1>
            <button onClick={() => window.print()} className="px-4 py-2 bg-stone-950 text-white font-bold rounded-xl text-xs shadow">🖨 Imprimir Informe</button>
          </div>
          <div className="p-5 bg-red-50 rounded-2xl border border-red-200 flex justify-between items-center">
            <div>
              <span className="text-[10px] font-bold text-red-600 uppercase">Pérdida Total por Mermas Contabilizadas</span>
              <div className="text-3xl font-extrabold text-red-900 mt-1">S/. {parseFloat(mermas.total_perdida_soles || 0).toFixed(2)}</div>
            </div>
            <div className="text-4xl text-red-300">📉</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PortalAdmin />);
  </script>
</body>
</html>
