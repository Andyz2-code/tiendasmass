<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Corporativo & Almacén – Tiendas Mass</title>
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/4/4b/Mass_logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Módulos de Accesibilidad y Estilos -->
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/logo.css">
  <script src="js/accessibility.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mass: {
              yellow: '#FDCB02',
              red: '#E30613',
              dark: '#1C1917',
              gray: '#F5F5F4'
            }
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-stone-100 text-stone-900 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const API_BASE = 'http://localhost/tiendasmass/backend/public/api';

    const api = axios.create({
      baseURL: API_BASE,
      headers: { 'Content-Type': 'application/json' }
    });

    api.interceptors.request.use((config) => {
      const token = localStorage.getItem('mass_admin_token');
      if (token) config.headers.Authorization = `Bearer ${token}`;
      return config;
    });

    api.interceptors.response.use(
      (res) => res.data,
      (err) => Promise.reject(new Error(err.response?.data?.message || err.message || 'Error en el servidor'))
    );

    function PortalAdmin() {
      const urlParams = new URLSearchParams(window.location.search);
      const initView = urlParams.get('view') || 'reportes_generales';

      const [clientSession] = useState(() => {
        return JSON.parse(localStorage.getItem('mass_user') || 'null');
      });

      const [user, setUser] = useState(() => {
        const saved = JSON.parse(localStorage.getItem('mass_admin_user') || 'null');
        if (saved && (saved.rol_nombre === 'Administrador' || saved.rol_nombre === 'Supervisor')) {
          return saved;
        }
        if (urlParams.get('auto_admin') === '1') {
          const u = { id: 1, nombres: 'Administrador', apellidos: 'Mass', email: 'admin@tiendasmass.pe', rol_nombre: 'Administrador' };
          localStorage.setItem('mass_admin_user', JSON.stringify(u));
          return u;
        }
        return null;
      });

      const [token, setToken] = useState(() => {
        let t = localStorage.getItem('mass_admin_token');
        if (!t && urlParams.get('auto_admin') === '1') {
          t = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjEsImlkIjoxLCJlbWFpbCI6ImFkbWluQHRpZW5kYXNtYXNzLnBlIiwicm9sX25vbWJyZSI6IkFkbWluaXN0cmFkb3IiLCJzdWN1cnNhbF9pZCI6bnVsbCwiZXhwIjoxNzk0OTc5Njg2LCJpYXQiOjE3OTQ4OTMyODZ9.W-00rRkS92STP64fMAxGRHHlwYEzTKFkyBDSm74XzcA';
          localStorage.setItem('mass_admin_token', t);
        }
        return t || null;
      });

      const isAdmin = user?.rol_nombre === 'Administrador';
      const isSupervisor = user?.rol_nombre === 'Supervisor';

      const [view, setView] = useState(() => initView);
      const [sucursales, setSucursales] = useState([]);
      const [selectedBranch, setSelectedBranch] = useState(null);

      useEffect(() => {
        api.get('/sucursales').then((res) => {
          const list = res.data || [];
          setSucursales(list);
          if (list.length > 0) {
            if (isSupervisor && user?.sucursal_id) {
              const myBranch = list.find(s => s.id === parseInt(user.sucursal_id)) || list[0];
              setSelectedBranch(myBranch);
            } else {
              const saved = JSON.parse(localStorage.getItem('mass_admin_branch') || 'null');
              const initial = list.find(s => s.id === saved?.id) || list[0];
              setSelectedBranch(initial);
            }
          }
        }).catch(console.error);
      }, [user, isSupervisor]);

      const handleSelectBranch = (bId) => {
        if (isSupervisor) {
          return; // Supervisor strictly locked to their assigned branch
        }
        const b = sucursales.find(s => s.id === parseInt(bId));
        if (b) {
          setSelectedBranch(b);
          localStorage.setItem('mass_admin_branch', JSON.stringify(b));
        }
      };

      const handleLogout = () => {
        setUser(null);
        setToken(null);
        localStorage.removeItem('mass_admin_user');
        localStorage.removeItem('mass_admin_token');
      };

      // 1. RESTRICCIÓN OBLIGATORIA DE SEGURIDAD:
      // Si el usuario en localStorage tiene perfil de CLIENTE, denegar acceso y redirigir a su tienda web.
      if (clientSession && (clientSession.tipo_usuario === 'cliente' || clientSession.rol_nombre === 'Cliente')) {
        return (
          <div className="min-h-screen bg-stone-900 flex flex-col items-center justify-center p-4 text-center">
            <div className="max-w-md w-full bg-white rounded-3xl p-8 shadow-2xl space-y-4">
              <div className="w-16 h-16 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center text-3xl mx-auto">🚫</div>
              <h2 className="text-xl font-black text-stone-900">Acceso Denegado (403)</h2>
              <p className="text-xs text-stone-600 font-semibold leading-relaxed">
                Su cuenta actual corresponde al perfil de <strong>Cliente de Tienda Mass</strong>. No posee autorización para ingresar al Backoffice ni al entorno de gestión operativa.
              </p>
              <button
                onClick={() => { window.location.href = 'index.html'; }}
                className="w-full py-3 bg-mass-yellow text-stone-950 font-black rounded-xl text-xs uppercase tracking-wider hover:bg-amber-400 transition shadow-lg"
              >
                Volver a la Tienda Mass
              </button>
            </div>
          </div>
        );
      }

      // Si no ha iniciado sesión, mostrar Login Exclusivo de Admin / Supervisor
      if (!user || !token) {
        return (
          <LoginAdminSupervisor
            onSuccess={(u, t) => {
              if (u.rol_nombre !== 'Administrador' && u.rol_nombre !== 'Supervisor') {
                alert('Acceso no autorizado: Solo personal con rol Administrador o Supervisor puede acceder.');
                return;
              }
              setUser(u);
              setToken(t);
              localStorage.setItem('mass_admin_user', JSON.stringify(u));
              localStorage.setItem('mass_admin_token', t);
            }}
          />
        );
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-stone-100">
          {/* Sidebar Corporativo */}
          <aside className="w-full md:w-64 bg-stone-900 text-stone-200 border-r border-stone-800 flex flex-col">
            <div className="p-4 border-b border-stone-800 flex items-center gap-3">
              <div className="flex items-center justify-center shrink-0">
                <img
                  src="assets/images/logo-mass-isotipo.png"
                  alt="Tiendas Mass"
                  className="h-9 w-auto object-contain select-none hover:scale-105 transition-transform"
                  onError={(e) => { e.target.src = 'assets/logo-mass-isotipo.png'; }}
                />
              </div>
              <div>
                <div className="font-extrabold text-white text-base tracking-tight leading-tight">TIENDAS MASS</div>
                <div className="text-[10px] text-amber-400 font-extrabold uppercase tracking-wider">Backoffice Corporativo</div>
              </div>
            </div>

            {/* Sucursal activa */}
            <div className="p-4 border-b border-stone-800 bg-stone-950/40">
              <label className="text-[10px] uppercase font-bold text-stone-400 block mb-1">
                🏢 Sucursal Operativa:
              </label>
              {isAdmin ? (
                <select
                  value={selectedBranch?.id || ''}
                  onChange={(e) => handleSelectBranch(e.target.value)}
                  className="w-full bg-stone-800 border border-stone-700 text-white rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-amber-400"
                >
                  {sucursales.map(s => (
                    <option key={s.id} value={s.id}>{s.nombre} ({s.codigo_tienda})</option>
                  ))}
                </select>
              ) : (
                <div className="px-2.5 py-1.5 bg-stone-800 rounded-lg text-xs font-bold text-amber-300 border border-stone-700">
                  {user.sucursal_nombre || selectedBranch?.nombre}
                </div>
              )}
            </div>

            {/* Navegación Corporativa */}
            <nav className="flex-1 p-3 space-y-1 overflow-y-auto custom-scroll text-xs font-bold">
              {[
                { id: 'reportes_generales', label: 'Reportes Generales de Ventas', icon: '📈', badge: 'Principal' },
                { id: 'productos', label: 'Catálogo & Edición de Productos', icon: '📦', badge: 'Gestión' },
                { id: 'dashboard', label: 'Dashboard ABC & POR', icon: '📊' },
                { id: 'inventario', label: 'Inventario & Kardex Físico', icon: '📋' },
                { id: 'almacen', label: 'Almacén & Picking PEPS', icon: '🏭' },
                { id: 'conteos', label: 'Conteos Cíclicos ABC', icon: '📝' },
                { id: 'delivery', label: 'Rastreo Satelital GPS', icon: '🛵' },
                { id: 'banners', label: 'Banners & Promociones', icon: '🖼️', badge: 'Nuevo' },
                { id: 'reportes', label: 'Auditoría Mermas NIC 2', icon: '📉' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setView(item.id)}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl transition ${
                    view === item.id
                      ? 'bg-mass-yellow text-stone-950 shadow-sm font-extrabold'
                      : 'text-stone-300 hover:bg-stone-800 hover:text-white'
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </div>
                  {item.badge && (
                    <span className="text-[9px] bg-red-600 text-white px-1.5 py-0.5 rounded font-extrabold">
                      {item.badge}
                    </span>
                  )}
                </button>
              ))}
            </nav>

            {/* Footer Usuario */}
            <div className="p-4 border-t border-stone-800 bg-stone-950/60 flex items-center justify-between">
              <div className="flex items-center gap-2.5 overflow-hidden">
                <div className="w-8 h-8 rounded-lg bg-amber-400/20 text-amber-400 border border-amber-400/40 flex items-center justify-center font-bold text-xs">
                  {user.nombres?.[0] || 'A'}
                </div>
                <div className="truncate text-xs">
                  <div className="font-bold text-white truncate">{user.nombres} {user.apellidos}</div>
                  <div className="text-[10px] text-amber-400 font-semibold">{user.rol_nombre}</div>
                </div>
              </div>
              <button onClick={() => { if (confirm("¿Desea cerrar la sesión del portal administrativo?")) handleLogout(); }} title="Cerrar sesión" className="flex items-center gap-1 px-2.5 py-1 bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-800 rounded-lg text-xs font-bold transition">
                <span>🚪</span><span>Salir</span>
              </button>
            </div>
          </aside>

          {/* Área de Trabajo */}
          <div className="flex-1 flex flex-col min-w-0">
            {/* Topbar */}
            <header className="h-16 bg-white border-b border-stone-200 flex items-center justify-between px-6 z-20">
              <div className="font-bold text-stone-800 text-sm">
                🏢 {selectedBranch?.nombre || 'Huancayo'} · {user.rol_nombre} Activo
              </div>

              <div className="flex items-center gap-3">
                <a
                  href="index.html"
                  target="_blank"
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-100 hover:bg-amber-200 text-amber-950 border border-amber-300 shadow-sm transition"
                >
                  <span>🛒 Ver Tienda Cliente</span>
                  <span>↗</span>
                </a>
              </div>
            </header>

            {/* Vistas Administrativas */}
            <main className="flex-1 p-6 overflow-y-auto">
              {view === 'productos' && <AdminProductosView branch={selectedBranch} user={user} />}
              {view === 'dashboard' && <AdminDashboardView branch={selectedBranch} user={user} />}
              {view === 'inventario' && <AdminInventarioView branch={selectedBranch} user={user} />}
              {view === 'almacen' && <AdminAlmacenView branch={selectedBranch} user={user} />}
              {view === 'conteos' && <AdminConteosView branch={selectedBranch} user={user} />}
              {view === 'delivery' && <AdminDeliveryView branch={selectedBranch} user={user} />}
              {view === 'reportes_generales' && <AdminReportesGeneralesView branch={selectedBranch} user={user} />}
              {view === 'banners' && <AdminBannersView branch={selectedBranch} user={user} sucursales={sucursales} />}
              {view === 'reportes' && <AdminReportesView branch={selectedBranch} user={user} />}
            </main>
            <AccessibilityWidget />
          </div>
        </div>
      );
    }

    // ==========================================
    // 0. PANEL DE ACCESIBILIDAD BACKOFFICE (WCAG 2.2 AA)
    // Conectado al motor modular /frontend/js/accessibility.js
    // ==========================================
    function AccessibilityWidget() {
      const [isOpen, setIsOpen] = useState(false);
      const [a11yState, setA11yState] = useState(() => {
        return window.MassA11y ? window.MassA11y.getState() : {
          fontSize: 'normal',
          contrast: 'normal',
          highFocus: false
        };
      });

      useEffect(() => {
        if (window.MassA11y) {
          return window.MassA11y.subscribe(setA11yState);
        }
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isOpen) setIsOpen(false);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen]);

      const handleFontSize = (size) => {
        if (window.MassA11y) window.MassA11y.setFontSize(size);
      };

      const handleContrast = (mode) => {
        if (window.MassA11y) window.MassA11y.setContrast(mode);
      };

      const handleHighFocus = (checked) => {
        if (window.MassA11y) window.MassA11y.setHighFocus(checked);
      };

      const handleReset = () => {
        if (window.MassA11y) window.MassA11y.reset();
      };

      return (
        <>
          <button
            onClick={() => setIsOpen(!isOpen)}
            aria-label="Abrir panel de accesibilidad"
            aria-expanded={isOpen}
            data-a11y-keep="true"
            className="fixed bottom-5 left-5 z-40 bg-stone-900 hover:bg-black text-mass-yellow p-3 rounded-full shadow-2xl border-2 border-amber-400 focus:outline-none focus:ring-4 focus:ring-amber-300 transition transform hover:scale-110 active:scale-95 flex items-center justify-center font-extrabold text-sm"
            title="Herramientas de Accesibilidad (WCAG 2.2 AA)"
          >
            👁️
          </button>

          {isOpen && (
            <div
              id="a11y-widget-panel"
              className="fixed bottom-20 left-5 z-50 w-80 sm:w-96 rounded-3xl shadow-2xl p-5 space-y-4 text-xs animate-in zoom-in-95 duration-200"
              role="dialog"
              aria-modal="true"
              aria-label="Herramientas de Accesibilidad Web"
            >
              <div className="flex items-center justify-between pb-3 border-b border-stone-200">
                <div className="flex items-center gap-2">
                  <span className="text-lg">♿</span>
                  <div>
                    <h3 className="font-extrabold text-stone-900 text-sm">Accesibilidad Backoffice</h3>
                    <p className="text-[10px] text-stone-500 font-medium">Estándar WCAG 2.2 Nivel AA</p>
                  </div>
                </div>
                <button
                  onClick={() => setIsOpen(false)}
                  aria-label="Cerrar panel de accesibilidad"
                  data-a11y-keep="true"
                  className="w-7 h-7 rounded-full bg-stone-100 hover:bg-stone-200 font-bold flex items-center justify-center"
                >
                  ✕
                </button>
              </div>

              {/* 1. Tamaño del Texto */}
              <div className="space-y-1.5">
                <label className="font-bold text-stone-800 flex items-center gap-1.5">
                  <span>🔤 Tamaño del Texto</span>
                </label>
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { id: 'normal', label: 'Normal' },
                    { id: 'large', label: '115% +' },
                    { id: 'xlarge', label: '125% ++' }
                  ].map((item) => (
                    <button
                      key={item.id}
                      onClick={() => handleFontSize(item.id)}
                      data-a11y-keep="true"
                      className={`py-2 px-1 rounded-xl text-center font-bold border transition ${
                        a11yState.fontSize === item.id
                          ? 'bg-mass-yellow text-stone-950 border-2 border-stone-900 font-black shadow-sm ring-2 ring-amber-300'
                          : 'bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100'
                      }`}
                    >
                      {a11yState.fontSize === item.id ? '✓ ' : ''}{item.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* 2. Contraste Visual */}
              <div className="space-y-1.5">
                <label className="font-bold text-stone-800 flex items-center gap-1.5">
                  <span>🎨 Contraste Visual</span>
                </label>
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { id: 'normal', label: 'Estándar' },
                    { id: 'high', label: 'Alto Contraste' },
                    { id: 'grayscale', label: 'Gris' }
                  ].map((item) => (
                    <button
                      key={item.id}
                      onClick={() => handleContrast(item.id)}
                      data-a11y-keep="true"
                      className={`py-2 px-1 rounded-xl text-center font-bold border transition ${
                        a11yState.contrast === item.id
                          ? 'bg-mass-yellow text-stone-950 border-2 border-stone-900 font-black shadow-sm ring-2 ring-amber-300'
                          : 'bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100'
                      }`}
                    >
                      {a11yState.contrast === item.id ? '✓ ' : ''}{item.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* 3. Resaltar Foco Teclado */}
              <div className="pt-1">
                <label className="flex items-center justify-between p-2.5 rounded-2xl bg-stone-50 border border-stone-200 cursor-pointer hover:bg-stone-100 select-none">
                  <div>
                    <span className="font-bold text-stone-900 block">Resaltar Foco Teclado</span>
                    <span className="text-[10px] text-stone-500">Bordes visibles con Tab (WCAG 2.4.7)</span>
                  </div>
                  <input
                    type="checkbox"
                    checked={a11yState.highFocus}
                    onChange={(e) => handleHighFocus(e.target.checked)}
                    className="w-4 h-4 text-mass-red accent-mass-red rounded cursor-pointer"
                  />
                </label>
              </div>

              {/* 4. Restablecer y Cerrar */}
              <div className="pt-2 border-t border-stone-100 flex justify-between items-center">
                <button
                  type="button"
                  onClick={handleReset}
                  data-a11y-keep="true"
                  className="text-stone-500 hover:text-mass-red font-bold text-[11px]"
                >
                  Restablecer
                </button>
                <button
                  type="button"
                  onClick={() => setIsOpen(false)}
                  data-a11y-keep="true"
                  className="px-4 py-1.5 bg-mass-yellow text-stone-950 font-black rounded-xl text-xs hover:bg-amber-400 transition"
                >
                  Listo
                </button>
              </div>
            </div>
          )}
        </>
      );
    }

    // ==========================================
    // 1. LOGIN EXCLUSIVO ADMIN / SUPERVISOR
    // ==========================================
    function LoginAdminSupervisor({ onSuccess }) {
      const [email, setEmail] = useState('admin@tiendasmass.pe');
      const [password, setPassword] = useState('123456');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await api.post('/auth/login-user', { email, password });
          const u = res.data.user;
          if (u.rol_nombre !== 'Administrador' && u.rol_nombre !== 'Supervisor') {
            throw new Error('Acceso denegado: El usuario no posee perfil administrativo ni de supervisión.');
          }
          onSuccess(u, res.data.token);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const fillCreds = (em) => {
        setEmail(em);
        setPassword('123456');
      };

      return (
        <div className="min-h-screen bg-stone-900 flex flex-col justify-center items-center p-4">
          <div className="max-w-md w-full bg-white rounded-3xl p-8 shadow-2xl space-y-6">
            <div className="text-center space-y-3">
              <div className="inline-block mx-auto mb-2">
                <img
                  src="assets/images/logo-mass-oficial.png"
                  alt="Tiendas Mass - Precios bajos, ¡cerca de ti!"
                  className="h-11 sm:h-13 w-auto max-w-[280px] object-contain select-none"
                  onError={(e) => { e.target.src = 'assets/logo-mass-oficial.png'; }}
                />
              </div>
              <h1 className="text-xl font-extrabold text-stone-950">Acceso Personal Mass</h1>
              <p className="text-xs text-stone-500 font-medium">Exclusivo para Administradores Corporativos y Supervisores de Almacén</p>
            </div>

            {error && (
              <div className="p-3 bg-red-50 text-red-700 rounded-xl text-xs font-bold border border-red-200">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-bold text-stone-700 mb-1">Correo Institucional:</label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  placeholder="admin@tiendasmass.pe"
                  className="w-full px-3 py-2.5 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-400 focus:outline-none"
                />
              </div>

              <div>
                <label className="block font-bold text-stone-700 mb-1">Contraseña de Seguridad:</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full px-3 py-2.5 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-400 focus:outline-none"
                />
              </div>

              <button
                type="submit"

    // ==========================================
    // COMPONENTE: MODAL DE EDICIÓN DE PRODUCTO CON CAMBIO DE IMAGEN
    // ==========================================
    function AdminProductEditModal({ product, categorias, branchId, onClose, onSuccess }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      const [formData, setFormData] = useState({
        nombre: product.nombre || '',
        descripcion: product.descripcion || '',
        categoria_id: product.categoria_id || 1,
        unidad_medida: product.unidad_medida || 'UNIDAD',
        codigo_sku: product.codigo_sku || '',
        codigo_barras: product.codigo_barras || '',
        precio_venta: parseFloat(product.precio_venta || 0),
        costo_base: parseFloat(product.costo_base || 0),
        stock_actual: parseInt(product.stock_actual || 0),
        es_perecedero: product.es_perecedero ? 1 : 0,
        imagen_url: product.imagen_url || ''
      });

      const [selectedFile, setSelectedFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState(null);
      const [fileError, setFileError] = useState('');
      const [saving, setSaving] = useState(false);

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        setFileError('');
        if (!file) {
          setSelectedFile(null);
          setPreviewUrl(null);
          return;
        }

        const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
        if (!validTypes.includes(file.type)) {
          setFileError('Formato no permitido. Solo se aceptan imágenes JPG, PNG o WEBP.');
          e.target.value = '';
          return;
        }

        const maxSize = 5 * 1024 * 1024; // 5 MB
        if (file.size > maxSize) {
          setFileError('La imagen supera el peso máximo permitido de 5 MB.');
          e.target.value = '';
          return;
        }

        setSelectedFile(file);
        const reader = new FileReader();
        reader.onloadend = () => {
          setPreviewUrl(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const handleClearSelectedFile = () => {
        setSelectedFile(null);
        setPreviewUrl(null);
        setFileError('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          let finalImageUrl = formData.imagen_url;

          // Si seleccionó archivo nuevo, subirlo al servidor
          if (selectedFile) {
            const uploadForm = new FormData();
            uploadForm.append('image', selectedFile);

            const uploadRes = await axios.post(
              'http://localhost/tiendasmass/backend/public/api/upload/image',
              uploadForm,
              {
                headers: {
                  'Content-Type': 'multipart/form-data',
                  'Authorization': `Bearer ${localStorage.getItem('mass_admin_token')}`
                }
              }
            );

            if (uploadRes.data?.data?.url) {
              finalImageUrl = uploadRes.data.data.url;
            }
          }

          // Actualizar producto en DB y catálogo
          const payload = {
            ...formData,
            imagen_url: finalImageUrl,
            sucursal_id: branchId
          };

          await api.put(`/productos/${product.id}`, payload);
          onSuccess(`¡Producto "${formData.nombre}" actualizado con éxito! Se sincronizó el catálogo y el stock en la sucursal.`);
        } catch (err) {
          alert('Error al guardar cambios: ' + (err.message || 'Error en el servidor'));
        } finally {
          setSaving(false);
        }
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn"
          role="dialog"
          aria-modal="true"
          aria-label="Editar Producto e Imagen"
        >
          <div className="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl space-y-4 text-xs max-h-[92vh] overflow-y-auto custom-scroll">
            <div className="flex justify-between items-center pb-2 border-b">
              <div>
                <span className="text-sm font-extrabold text-stone-900">Editar Producto & Imagen</span>
                <p className="text-[11px] text-stone-500">ID #{product.id} • SKU: {product.codigo_sku}</p>
              </div>

    // ==========================================
    // COMPONENTE: MODAL DE IMPORTACIÓN MASIVA DESDE EXCEL / CSV
    // ==========================================
    function AdminExcelImportModal({ branch, user, categorias, onClose, onSuccess }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      const [parsedRows, setParsedRows] = useState([]);
      const [fileName, setFileName] = useState('');
      const [validating, setValidating] = useState(false);
      const [importing, setImporting] = useState(false);
      const [stats, setStats] = useState({ total: 0, validos: 0, duplicados: 0, errores: 0 });
      const [importResult, setImportResult] = useState(null);

      const downloadTemplate = () => {
        const headers = ["codigo_sku", "codigo_barras", "nombre", "descripcion", "categoria", "precio_venta", "costo_base", "stock_inicial", "unidad_medida", "es_perecedero", "imagen_url"];
        const rows = [
          headers.join(","),
          ["SKU-IMP-001", "775990001001", "Arroz Extra Añejo Costeño 1kg", "Arroz seleccionado grano largo de calidad superior", "Abarrotes", "4.80", "3.60", "80", "BOLSA", "0", "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"].join(","),
          ["SKU-IMP-002", "775990001002", "Leche Evaporada Gloria Azul 400g", "Leche entera enriquecida con vitaminas A y D", "Lácteos y Huevos", "4.20", "3.20", "120", "LATA", "1", "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400"].join(","),
          ["SKU-IMP-003", "775990001003", "Detergente Floral Bolívar 900g", "Detergente en polvo multiusos para ropa", "Limpieza", "7.90", "5.80", "45", "BOLSA", "0", "https://images.unsplash.com/photo-1610557892470-55d9e80c0bce?w=400"].join(",")
        ].join("\n");

        const blob = new Blob([rows], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "Plantilla_Importacion_Productos_TiendasMass.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setFileName(file.name);
        setValidating(true);
        setImportResult(null);

        const reader = new FileReader();
        reader.onload = (event) => {
          const text = event.target.result;
          parseAndValidateCSV(text);
          setValidating(false);
        };
        reader.readAsText(file);
      };

      const parseAndValidateCSV = (text) => {
        const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
        if (lines.length <= 1) {
          alert('El archivo no contiene registros de productos.');
          setParsedRows([]);
          return;
        }

        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
        const dataRows = [];
        const seenSkus = new Set();
        const seenBarcodes = new Set();

        let countValidos = 0;
        let countDuplicados = 0;
        let countErrores = 0;

        for (let i = 1; i < lines.length; i++) {
          const rawCols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
          const rowObj = {};
          headers.forEach((h, idx) => {
            rowObj[h] = rawCols[idx] !== undefined ? rawCols[idx] : '';
          });

          const sku = (rowObj.codigo_sku || '').toUpperCase();
          const barcode = rowObj.codigo_barras || '';
          const nombre = rowObj.nombre || '';
          const precio = parseFloat(rowObj.precio_venta || 0);
          const stock = parseInt(rowObj.stock_inicial || 0);

          let status = 'valido';
          let errorMsg = '';

          if (!sku) {
            status = 'error';
            errorMsg = 'Falta el código SKU obligatorio.';
          } else if (!nombre) {
            status = 'error';
            errorMsg = 'Falta el nombre del producto.';
          } else if (isNaN(precio) || precio <= 0) {
            status = 'error';
            errorMsg = 'Precio de venta debe ser un número positivo.';
          } else if (isNaN(stock) || stock < 0) {
            status = 'error';
            errorMsg = 'Stock inicial no puede ser negativo.';
          } else if (seenSkus.has(sku)) {
            status = 'duplicado';
            errorMsg = `SKU duplicado en el archivo (${sku}).`;
          } else if (barcode && seenBarcodes.has(barcode)) {
            status = 'duplicado';
            errorMsg = `Código de barras duplicado en el archivo (${barcode}).`;
          }

          if (sku) seenSkus.add(sku);
          if (barcode) seenBarcodes.add(barcode);

          if (status === 'valido') countValidos++;
          else if (status === 'duplicado') countDuplicados++;
          else countErrores++;

          dataRows.push({
            ...rowObj,
            fila: i + 1,
            _status: status,
            _error: errorMsg
          });
        }

        setParsedRows(dataRows);
        setStats({
          total: dataRows.length,
          validos: countValidos,
          duplicados: countDuplicados,
          errores: countErrores
        });
      };

      const handleExecuteImport = async () => {
        const validRows = parsedRows.filter(r => r._status === 'valido');
        if (validRows.length === 0) {
          alert('No hay registros válidos para importar. Revise los errores señalados.');
          return;
        }

        setImporting(true);
        try {
          const res = await api.post('/productos/import-excel', {
            sucursal_id: branch?.id,
            rows: validRows
          });

          setImportResult(res.data || res);
          if (res.data?.importados > 0) {
            setTimeout(() => {
              onSuccess(`¡Importación completada! Se registraron ${res.data.importados} productos correctamente en la sucursal.`);
            }, 2500);
          }
        } catch (err) {
          alert('Error durante la importación: ' + (err.message || 'Error en el servidor'));
        } finally {
          setImporting(false);
        }
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn"
          role="dialog"
          aria-modal="true"
          aria-label="Importación Masiva de Productos desde Excel"
        >
          <div className="bg-white rounded-3xl max-w-4xl w-full p-6 shadow-2xl space-y-4 text-xs max-h-[92vh] overflow-y-auto custom-scroll">
            <div className="flex justify-between items-center pb-2 border-b">
              <div>
                <span className="text-sm font-extrabold text-stone-900">Importación Masiva de Productos desde Excel / CSV</span>
                <p className="text-[11px] text-stone-500">
                  Carga masiva adaptada a la base de datos • Sucursal destino: <strong>{branch?.nombre}</strong>
                </p>
              </div>
              <button onClick={onClose} className="font-bold text-stone-400 hover:text-stone-700 text-sm">✕</button>
            </div>

            {/* Cabecera y acciones de archivo */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-stone-50 p-4 rounded-2xl border">
              <div className="space-y-2">
                <span className="font-extrabold text-stone-800 block">Paso 1: Descargar Formato Oficial</span>
                <p className="text-[11px] text-stone-500">
                  Utiliza la plantilla con las columnas exactas del sistema (`codigo_sku`, `nombre`, `precio_venta`, etc.).
                </p>
                <button
                  type="button"
                  onClick={downloadTemplate}
                  className="px-3.5 py-2 bg-stone-200 hover:bg-stone-300 text-stone-900 font-bold rounded-xl text-xs transition inline-flex items-center gap-1.5"
                >
                  <span>⬇ Descargar Plantilla Excel / CSV</span>
                </button>
              </div>

              <div className="space-y-2">
                <span className="font-extrabold text-stone-800 block">Paso 2: Seleccionar Archivo Diligenciado</span>
                <p className="text-[11px] text-stone-500">
                  Sube el archivo CSV o Excel completado para su previsualización y validación.
                </p>
                <input
                  type="file"
                  accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel"
                  onChange={handleFileChange}
                  className="block w-full text-xs text-stone-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-[11px] file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer"
                />
              </div>
            </div>

            {/* Resumen de Validación Previa */}
            {parsedRows.length > 0 && (
              <div className="space-y-3">
                <div className="grid grid-cols-4 gap-2 text-center">
                  <div className="p-2.5 bg-stone-100 rounded-xl border">
                    <div className="text-[10px] uppercase font-bold text-stone-500">Total Filas</div>
                    <div className="text-base font-black text-stone-900">{stats.total}</div>
                  </div>
                  <div className="p-2.5 bg-emerald-50 rounded-xl border border-emerald-200">
                    <div className="text-[10px] uppercase font-bold text-emerald-700">Listos (Válidos)</div>
                    <div className="text-base font-black text-emerald-800">{stats.validos}</div>
                  </div>
                  <div className="p-2.5 bg-amber-50 rounded-xl border border-amber-200">
                    <div className="text-[10px] uppercase font-bold text-amber-700">Duplicados</div>
                    <div className="text-base font-black text-amber-800">{stats.duplicados}</div>
                  </div>
                  <div className="p-2.5 bg-red-50 rounded-xl border border-red-200">
                    <div className="text-[10px] uppercase font-bold text-red-700">Con Errores</div>
                    <div className="text-base font-black text-red-800">{stats.errores}</div>
                  </div>
                </div>

                {/* Tabla de Previsualización */}
                <div className="border rounded-2xl overflow-hidden shadow-sm">
                  <div className="p-2.5 bg-stone-100 border-b font-bold text-stone-700 flex justify-between items-center text-[11px]">
                    <span>Vista Previa de Registros a Importar ({parsedRows.length})</span>
                    <span className="text-stone-500 font-normal">Archivo: {fileName}</span>
                  </div>
                  <div className="max-h-60 overflow-y-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-stone-50 text-stone-600 uppercase text-[9px] font-bold border-b sticky top-0">
                        <tr>
                          <th className="p-2">#</th>
                          <th className="p-2">Estado</th>
                          <th className="p-2">SKU</th>
                          <th className="p-2">Nombre</th>
                          <th className="p-2">Categoría</th>
                          <th className="p-2">Precio</th>
                          <th className="p-2">Stock</th>
                          <th className="p-2">Motivo / Validación</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y font-medium text-[11px]">
                        {parsedRows.map((r, idx) => (
                          <tr key={idx} className={r._status === 'valido' ? 'hover:bg-emerald-50/30' : r._status === 'duplicado' ? 'bg-amber-50/50' : 'bg-red-50/50'}>
                            <td className="p-2 font-mono text-stone-400">{r.fila}</td>
                            <td className="p-2">
                              {r._status === 'valido' && (
                                <span className="px-2 py-0.5 rounded text-[10px] font-extrabold bg-emerald-100 text-emerald-800">
                                  ✓ Válido
                                </span>
                              )}
                              {r._status === 'duplicado' && (
                                <span className="px-2 py-0.5 rounded text-[10px] font-extrabold bg-amber-100 text-amber-800">
                                  ⚠ Duplicado
                                </span>
                              )}
                              {r._status === 'error' && (
                                <span className="px-2 py-0.5 rounded text-[10px] font-extrabold bg-red-100 text-red-800">
                                  ✕ Error
                                </span>
                              )}
                            </td>
                            <td className="p-2 font-mono font-bold text-stone-900">{r.codigo_sku || '-'}</td>
                            <td className="p-2 font-medium max-w-xs truncate">{r.nombre || '-'}</td>
                            <td className="p-2 text-stone-600">{r.categoria || '-'}</td>
                            <td className="p-2 font-bold text-stone-900">S/. {parseFloat(r.precio_venta || 0).toFixed(2)}</td>
                            <td className="p-2 font-bold">{r.stock_inicial || 0}</td>
                            <td className="p-2 text-stone-500">
                              {r._status === 'valido' ? (
                                <span className="text-emerald-700">Listo para insertar</span>
                              ) : (
                                <span className="text-red-700 font-bold">{r._error}</span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Resultado de Ejecución si ya se procesó */}
                {importResult && (
                  <div className="p-4 bg-emerald-50 border border-emerald-300 rounded-2xl text-xs space-y-2">
                    <div className="font-extrabold text-emerald-900 flex items-center gap-2">
                      <span className="text-lg">🎉</span>
                      <span>Resumen de Importación Ejecutada:</span>
                    </div>
                    <div className="grid grid-cols-3 gap-2 font-bold text-stone-700">
                      <div>Registrados con éxito: <span className="text-emerald-700 font-black">{importResult.importados}</span></div>
                      <div>Omitidos (Ya existían): <span className="text-amber-700 font-black">{importResult.omitidos_duplicados}</span></div>
                      <div>Con Errores: <span className="text-red-700 font-black">{importResult.errores}</span></div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Acciones del Modal */}
            <div className="flex items-center justify-between pt-3 border-t">
              <span className="text-[11px] text-stone-500">
                {user?.rol_nombre === 'Supervisor' ? '🔒 Restringido a su sucursal asignada.' : '🌐 Permisos de Administrador Global.'}
              </span>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl border border-stone-300 font-bold hover:bg-stone-50 transition"
                >
                  Cerrar
                </button>
                <button
                  type="button"
                  disabled={importing || stats.validos === 0}
                  onClick={handleExecuteImport}
                  className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl shadow-md transition disabled:opacity-50 text-xs"
                >
                  {importing ? 'Importando registros...' : `Confirmar e Importar ${stats.validos} Registros Válidos`}
                </button>
              </div>
            </div>
          </div>
        </div>

                        <td className="p-3 font-bold">{row.producto_nombre}</td>
                        <td className="p-3 font-extrabold">{row.stock_actual} un.</td>
                        <td className="p-3">{row.punto_reorden}</td>
                        <td className="p-3 font-bold text-amber-700">Clase {row.clasificacion_abc}</td>
                        <td className="p-3 font-bold">S/. {parseFloat(row.precio_venta).toFixed(2)}</td>

                        <td className="p-3 font-mono font-bold">{row.codigo_lote}</td>
                        <td className="p-3 font-bold">{row.producto_nombre}</td>
                        <td className="p-3">{row.fecha_ingreso}</td>
                        <td className="p-3">{row.fecha_vencimiento || 'N/A'}</td>

                      <>

    // ==========================================
    // 5. ALMACÉN & PICKING
    // ==========================================
    function AdminAlmacenView({ branch }) {
      const [pedidos, setPedidos] = useState([]);
      const load = () => {
        if (!branch?.id) return;
        api.get(`/pedidos?sucursal_id=${branch.id}`).then(r => setPedidos(r.data || []));
      };
      useEffect(() => { load(); }, [branch]);

      const advance = (id, n) => {
        api.put(`/pedidos/${id}/estado`, { estado_pedido: n }).then(() => load());
      };

      return (
        <div className="space-y-6">
          <h1 className="text-xl font-extrabold text-stone-900 tracking-tight">Almacén: Cola de Picking y Empaque PEPS</h1>
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            {['PENDIENTE', 'EN_PREPARACION', 'LISTO_PARA_DESPACHO', 'DESPACHADO'].map(col => {
              const list = pedidos.filter(p => p.estado_pedido === col);
              const nextState = col === 'PENDIENTE' ? 'EN_PREPARACION' : col === 'EN_PREPARACION' ? 'LISTO_PARA_DESPACHO' : 'DESPACHADO';
              const nextLabel = col === 'PENDIENTE' ? 'Iniciar Picking' : col === 'EN_PREPARACION' ? 'Completar Empaque' : 'Despachar (En Ruta)';

              return (
                <div key={col} className="bg-white rounded-2xl border p-4 shadow-sm flex flex-col h-[500px]">
                  <div className="font-extrabold text-xs pb-2 border-b flex justify-between">
                    <span>{col}</span>
                    <span className="bg-stone-100 px-2 rounded">{list.length}</span>
                  </div>
                  <div className="flex-1 overflow-y-auto space-y-2 pt-2 custom-scroll">
                    {list.map(p => (
                      <div key={p.id} className="p-3 bg-stone-50 rounded-xl border text-xs space-y-1">
                        <div className="flex justify-between font-mono font-bold">
                          <span>{p.codigo_pedido}</span>
                          <span className="text-[10px] bg-stone-200 px-1 rounded">{p.tipo_entrega}</span>
                        </div>
                        <div className="text-stone-600 font-semibold">{p.cliente_nombres} {p.cliente_apellidos}</div>
                        <div className="flex justify-between items-center pt-2 border-t">
                          <span className="font-bold">S/. {parseFloat(p.total).toFixed(2)}</span>
                          {col !== 'DESPACHADO' && (
                            <button onClick={() => advance(p.id, nextState)} className="px-2 py-1 bg-stone-950 text-amber-300 font-bold text-[10px] rounded-lg">
                              {nextLabel}
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. CONTEOS CÍCLICOS
    // ==========================================
    function AdminConteosView({ branch, user }) {
      const [conteos, setConteos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [trabajadores, setTrabajadores] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isDetailOpen, setIsDetailOpen] = useState(false);
      const [selectedConteo, setSelectedConteo] = useState(null);
      const [physicalInputs, setPhysicalInputs] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [busquedaTrabajador, setBusquedaTrabajador] = useState('');
      const isAdmin = user?.rol_nombre === 'Administrador';

      // Formulario de programación
      const [formData, setFormData] = useState({
        sucursal_id: branch?.id || 1,
        encargado_id: '',
        trabajadores_apoyo: [],
        fecha_programada: new Date(Date.now() + 86400000).toISOString().split('T')[0],
        hora_programada: '08:30',
        estrato_abc: 'A',
        observaciones: 'Auditoría periódica de inventario y rotación PEPS'
      });

      const loadConteos = () => {
        setLoading(true);
        const sucParam = (!isAdmin && user?.sucursal_id) ? user.sucursal_id : (branch?.id || '');
        const q = sucParam ? `?sucursal_id=${sucParam}` : '';
        api.get(`/conteos${q}`)
          .then(r => setConteos(r.data || []))
          .catch(console.error)
          .finally(() => setLoading(false));
      };

      const loadTrabajadores = (sucId) => {
        api.get(`/conteos/trabajadores?sucursal_id=${sucId}`)
          .then(r => {
            const list = r.data || [];
            setTrabajadores(list);
            if (list.length > 0 && !formData.encargado_id) {
              setFormData(prev => ({ ...prev, encargado_id: list[0].id }));
            }
          })
          .catch(console.error);
      };

      useEffect(() => {
        loadConteos();
      }, [branch, user]);

      useEffect(() => {
        const targetSuc = formData.sucursal_id || branch?.id || 1;
        loadTrabajadores(targetSuc);
      }, [formData.sucursal_id]);

      const handleOpenProgramar = () => {
        const defaultSuc = (!isAdmin && user?.sucursal_id) ? user.sucursal_id : (branch?.id || 1);
        setFormData({
          sucursal_id: defaultSuc,
          encargado_id: trabajadores[0]?.id || '',
          trabajadores_apoyo: [],
          fecha_programada: new Date(Date.now() + 86400000).toISOString().split('T')[0],
          hora_programada: '08:30',
          estrato_abc: 'A',
          observaciones: 'Auditoría periódica con control de lotes y vencimientos'
        });
        setBusquedaTrabajador('');
        setIsModalOpen(true);
      };

      const handleToggleApoyo = (id) => {
        setFormData(prev => {
          const current = prev.trabajadores_apoyo || [];
          if (current.includes(id)) {
            return { ...prev, trabajadores_apoyo: current.filter(x => x !== id) };
          } else {
            return { ...prev, trabajadores_apoyo: [...current, id] };
          }
        });
      };

      const handleSaveProgramacion = (e) => {
        e.preventDefault();
        if (!formData.encargado_id) {
          alert('Debe seleccionar obligatoriamente un encargado responsable.');
          return;
        }
        setIsSubmitting(true);
        api.post('/conteos', formData)
          .then(res => {
            alert('✓ ' + (res.message || 'Conteo programado exitosamente. Asignaciones listas para chatbot WhatsApp.'));
            setIsModalOpen(false);
            loadConteos();
          })
          .catch(err => alert('Error: ' + err.message))
          .finally(() => setIsSubmitting(false));
      };

      const handleOpenDetail = (conteoId) => {
        api.get(`/conteos/${conteoId}`).then(res => {
          const c = res.data;
          setSelectedConteo(c);
          const initial = {};
          (c.detalles || []).forEach(d => {
            initial[d.producto_id] = d.stock_fisico !== null ? d.stock_fisico : '';
          });
          setPhysicalInputs(initial);
          setIsDetailOpen(true);
        }).catch(err => alert(err.message));
      };

      const handleCancelarConteo = (id) => {
        if (!confirm('¿Confirma cancelar la programación de este conteo de inventario?')) return;
        api.patch(`/conteos/${id}/cancelar`).then(() => {
          alert('Conteo cancelado.');
          loadConteos();
          if (isDetailOpen) setIsDetailOpen(false);
        }).catch(err => alert(err.message));
      };

      const handleGuardarTomasFisicas = () => {
        if (!selectedConteo) return;
        const items = Object.entries(physicalInputs).map(([prodId, val]) => ({
          producto_id: parseInt(prodId),
          stock_fisico: val === '' ? null : parseInt(val),
          justificacion: 'Toma física en almacén'
        }));
        api.post(`/conteos/${selectedConteo.id}/guardar`, { items }).then(() => {
          alert('✓ Tomas físicas guardadas exitosamente.');
          handleOpenDetail(selectedConteo.id);
          loadConteos();
        }).catch(err => alert(err.message));
      };

      const handleConciliar = () => {
        if (!selectedConteo) return;
        if (!confirm('¿Desea finalizar y conciliar este conteo? Se generarán los ajustes en el Kardex.')) return;
        api.post(`/conteos/${selectedConteo.id}/conciliar`).then(() => {
          alert('✓ Conciliación completada y asientos de ajuste registrados.');
          handleOpenDetail(selectedConteo.id);
          loadConteos();
        }).catch(err => alert(err.message));
      };

      const trabajadoresFiltrados = trabajadores.filter(t => {
        const q = busquedaTrabajador.toLowerCase();
        return `${t.nombres} ${t.apellidos} ${t.rol_nombre}`.toLowerCase().includes(q);
      });

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-3xl border shadow-xs">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-2 bg-amber-100 rounded-xl text-lg">📋</span>
                <h1 className="text-xl font-extrabold text-stone-900 tracking-tight">Programación y Asignación de Conteos Físicos</h1>
              </div>
              <p className="text-xs text-stone-500 mt-1">
                Planifique auditorías de inventario, asigne encargados principales y trabajadores de apoyo con fecha y hora de ejecución.
              </p>
            </div>
            <button
              onClick={handleOpenProgramar}
              className="px-4 py-2.5 bg-mass-yellow hover:bg-amber-400 font-extrabold text-stone-950 rounded-xl text-xs shadow-xs border border-amber-300 flex items-center gap-1.5 transition active:scale-95"
            >
              <span>➕</span>
              <span>Programar Conteo</span>
            </button>
          </div>

          {/* Listado de Conteos Programados */}
          <div className="bg-white rounded-3xl border shadow-xs overflow-hidden text-xs">
            <div className="p-4 border-b flex justify-between items-center bg-stone-50/50">
              <span className="font-extrabold text-stone-800">Historial y Programación de Auditorías</span>
              <span className="text-[11px] text-stone-500 font-bold">{conteos.length} registros</span>
            </div>

            {loading ? (
              <div className="p-8 text-center text-stone-400 font-bold animate-pulse">Cargando conteos programados...</div>
            ) : conteos.length === 0 ? (
              <div className="p-10 text-center space-y-2">
                <span className="text-3xl">📭</span>
                <div className="font-bold text-stone-700">No hay conteos programados en este momento.</div>
                <p className="text-stone-400 text-[11px]">Haga clic en "+ Programar Conteo" para asignar el primer equipo de auditoría.</p>
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left">
                  <thead className="bg-stone-50 text-stone-500 uppercase text-[10px] font-extrabold border-b">
                    <tr>
                      <th className="p-3">Código</th>
                      <th className="p-3">Sucursal</th>
                      <th className="p-3">Fecha & Hora</th>
                      <th className="p-3">Encargado Responsable</th>
                      <th className="p-3">Trabajadores de Apoyo</th>
                      <th className="p-3">Muestra ABC</th>
                      <th className="p-3">Avance</th>
                      <th className="p-3">Estado</th>
                      <th className="p-3 text-right">Acciones</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y font-medium text-stone-800">
                    {conteos.map(c => {
                      const apoyos = (c.asignaciones || []).filter(a => a.tipo_asignacion === 'APOYO');
                      const statusColors = {
                        'PROGRAMADO': 'bg-blue-100 text-blue-800 border-blue-200',
                        'PENDIENTE': 'bg-amber-100 text-amber-800 border-amber-200',
                        'EN_PROCESO': 'bg-purple-100 text-purple-800 border-purple-200 animate-pulse',
                        'FINALIZADO': 'bg-emerald-100 text-emerald-800 border-emerald-200',
                        'CONCILIADO': 'bg-emerald-100 text-emerald-800 border-emerald-200',
                        'CANCELADO': 'bg-stone-100 text-stone-500 border-stone-200'
                      };

                      return (
                        <tr key={c.id} className="hover:bg-stone-50/80 transition">
                          <td className="p-3 font-mono font-black text-mass-red">{c.codigo_conteo}</td>
                          <td className="p-3 font-bold">{c.sucursal_nombre}</td>
                          <td className="p-3 font-semibold">
                            <div>📅 {c.fecha_programada}</div>
                            <div className="text-[10px] text-stone-500">⏰ {c.hora_programada ? c.hora_programada.substring(0, 5) : '08:00'} hrs</div>
                          </td>
                          <td className="p-3">
                            <div className="font-extrabold text-stone-900">
                              ⭐ {c.encargado_nombres ? `${c.encargado_nombres} ${c.encargado_apellidos}` : 'Sin Asignar'}
                            </div>
                            {c.encargado_telefono && (
                              <div className="text-[10px] text-stone-500">📱 {c.encargado_telefono}</div>
                            )}
                          </td>
                          <td className="p-3">
                            {apoyos.length > 0 ? (
                              <div className="flex flex-wrap gap-1">
                                {apoyos.map(a => (
                                  <span key={a.usuario_id} className="px-2 py-0.5 bg-stone-100 text-stone-700 rounded-md text-[10px] font-bold border border-stone-200">
                                    👤 {a.nombres}
                                  </span>
                                ))}
                              </div>
                            ) : (
                              <span className="text-stone-400 text-[10px] italic">Solo encargado</span>
                            )}
                          </td>
                          <td className="p-3 font-black text-amber-700">Clase {c.estrato_abc}</td>
                          <td className="p-3">
                            <span className="font-bold">{c.items_contados || 0}</span> / <span className="text-stone-500">{c.total_items} items</span>
                          </td>
                          <td className="p-3">
                            <span className={`px-2.5 py-1 rounded-full text-[10px] font-black border ${statusColors[c.estado] || 'bg-stone-100 text-stone-700'}`}>
                              {c.estado}
                            </span>
                          </td>
                          <td className="p-3 text-right">
                            <div className="flex items-center justify-end gap-1.5">
                              <button
                                onClick={() => handleOpenDetail(c.id)}
                                className="px-2.5 py-1.5 bg-stone-900 hover:bg-stone-800 text-white rounded-lg text-[10px] font-bold"
                              >
                                Ver Detalle
                              </button>
                              {c.estado !== 'FINALIZADO' && c.estado !== 'CONCILIADO' && c.estado !== 'CANCELADO' && (
                                <button
                                  onClick={() => handleCancelarConteo(c.id)}
                                  className="px-2 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 rounded-lg text-[10px] font-bold border border-red-200"
                                  title="Cancelar Conteo"
                                >
                                  ✕
                                </button>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>

      const [fechaFin, setFechaFin] = useState(new Date().toISOString().split('T')[0]);

        setLoading(true);
        let q = `?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`;
        if (sucursalFilter) q += `&sucursal_id=${sucursalFilter}`;
        else if (!isAdmin && user?.sucursal_id) q += `&sucursal_id=${user.sucursal_id}`;
        else if (branch?.id) q += `&sucursal_id=${branch.id}`;

        api.get(`/reportes/general-admin${q}`).then(res => {
          setData(res.data || null);
        }).catch(err => {
          console.error(err);
        }).finally(() => setLoading(false));
      };

      useEffect(() => {
        fetchReport();
      }, [fechaInicio, fechaFin, sucursalFilter, branch?.id]);

      const resumen = data?.resumen || {};
      const ventasDia = data?.ventas_dia || { total_ingresos: 0, operaciones: 0, detalle_ventas: [] };
      const ventasMes = data?.ventas_mes || { total_ingresos: 0, operaciones: 0, ventas_por_dia: [] };
      const margenUtilidad = data?.margen_utilidad || { ingresos_ventas: 0, costo_ventas: 0, utilidad_bruta: 0, margen_porcentaje: 0 };
      const comparativa = data?.comparativa_sucursales || [];
      const altaRotacion = [...(data?.alta_rotacion || [])].sort((a, b) => {
        if (rotacionSort === 'soles') return parseFloat(b.total_soles_generado || 0) - parseFloat(a.total_soles_generado || 0);
        if (rotacionSort === 'operaciones') return parseInt(b.operaciones_count || 0) - parseInt(a.operaciones_count || 0);
        return parseInt(b.unidades_vendidas || 0) - parseInt(a.unidades_vendidas || 0);
      });
      const metodosPago = data?.metodos_pago || [];
      const agotados = data?.productos_agotados || [];
      const bajoStock = data?.productos_bajo_stock || [];

      return (

              <span>Imprimir Informe</span>
