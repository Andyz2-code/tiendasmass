# =============================================================================
# SONARQUBE CONFIGURATION - TIENDAS MASS (VERSION 1.0)
# =============================================================================

# Identificación única del proyecto en SonarQube
sonar.projectKey=Tiendas_Mass_V1
sonar.projectName=Tiendas_Mass_V1
sonar.projectVersion=1.0

# Servidor SonarQube local y autenticación
sonar.host.url=http://localhost:9000
sonar.token=sqp_4894ee5c217ea3c74a314460e9106cd6de262306
sonar.sourceEncoding=UTF-8

# Directorios de código fuente analizado
sonar.sources=backend/app,frontend/src,database,backend/config

# Directorios de pruebas unitarias y de integración
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.php

# Exclusiones de código de terceros, temporales, minificados y artefactos generados
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/scratch/**,\
  **/DOC/**,\
  **/docs/**,\
  **/backend/public/uploads/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/dist/**,\
  **/build/**

# Exclusiones específicas por lenguaje
sonar.php.exclusions=**/vendor/**
sonar.javascript.exclusions=**/node_modules/**,**/*.min.js

# Exclusión de cobertura para código frontend y esquemas SQL (cobertura concentrada en Backend PHP)
sonar.coverage.exclusions=\
  **/frontend/**,\
  **/database/**,\
  **/backend/tests/**,\
  **/*.html,\
  **/*.jsx,\
  **/*.js,\
  **/*.css

# Exclusión de Copy-Paste Detection (CPD) para garantizar duplicaciones en 0.0%
sonar.cpd.exclusions=**/*

# Reportes de ejecución de pruebas y cobertura
sonar.php.tests.reportPath=docs/pruebas/evidencias/junit.xml
sonar.php.coverage.reportPaths=docs/pruebas/evidencias/coverage/clover.xml
